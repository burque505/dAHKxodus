<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dAHKxodus</title><style>
  html, body { margin: 0; height: 100%; background: #f3f3f3; }
  #app { height: 100vh; }
  /* Save stays in the File menu and on Ctrl+S, not in the title bar; Settings has a gear there instead. */
  #app .dxr-quick [data-dxr="save"] { display: none; }
  #app .dax-settings { font-size: 22px; line-height: 1; padding: 0 6px; }
  /* The Macros tab's list (as AhkWord's macros gallery): under its button, styled as the ribbon's File menu. */
  .dax-macromenu { position: fixed; }
  /* The command palette (Ctrl+Shift+P): a box at the top, over the editor, in the ribbon's colours. */
  #app .dax-palette-button { padding: 0 6px; display: inline-flex; align-items: center; }
  /* A macro being recorded: a red mark with its steps in the title bar (a click stops it). */
  #app .dax-recmark { color: #dc2626; font-weight: 600; font-size: 12px; padding: 0 8px; background: #fef2f2; border-radius: 10px; }
  #app .dax-recmark[hidden] { display: none; }
  .dax-palette-back { position: fixed; inset: 0; z-index: 1000; background: rgba(15, 23, 42, .08); }
  .dax-palette {
    position: fixed; top: 72px; left: 50%; transform: translateX(-50%); width: min(640px, calc(100vw - 32px));
    max-height: calc(100vh - 140px); display: flex; flex-direction: column;
    background: var(--dxr-chrome, #fff); color: var(--dxr-ink, #1e293b); font: 13px var(--dxr-ui, "Segoe UI", sans-serif);
    border: 1px solid var(--dxr-rule-strong, #cbd5e1); border-radius: 8px; box-shadow: var(--dxr-shadow-xl, 0 8px 24px rgba(0,0,0,.15));
  }
  .dax-palette input {
    margin: 8px; padding: 8px 10px; font: inherit; font-size: 14px; color: inherit; background: var(--dxr-sheet, #fff);
    border: 1px solid var(--dxr-rule-strong, #cbd5e1); border-radius: 6px; outline: none;
  }
  .dax-palette input:focus { border-color: var(--dxr-accent, #0f766e); }
  .dax-palette ul { list-style: none; margin: 0; padding: 0 6px 6px; overflow-y: auto; }
  .dax-palette li { display: flex; gap: 12px; align-items: baseline; padding: 6px 8px; border-radius: 4px; cursor: pointer; }
  .dax-palette li[aria-selected="true"] { background: var(--dxr-wash-on, #ccfbf1); }
  .dax-palette li .dax-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dax-palette li .dax-state { color: var(--dxr-accent, #0f766e); font-size: 12px; }
  .dax-palette li .dax-where { color: var(--dxr-muted, #475569); font-size: 12px; white-space: nowrap; }
  .dax-palette li .dax-keys { color: var(--dxr-faint, #94a3b8); font-size: 12px; white-space: nowrap; }
  .dax-palette li.dax-off { cursor: default; }
  .dax-palette li.dax-off .dax-name, .dax-palette li.dax-off .dax-state { color: var(--dxr-faint, #94a3b8); }
  .dax-palette .dax-empty { padding: 6px 14px 12px; color: var(--dxr-muted, #475569); }
  /* Printing and PDF (the host's Print and Export to PDF): the document's pages only, one a sheet, as the page view
     draws them; the page's size comes from preparePrint's @page rule. */
  @media print {
    html, body, #app { height: auto !important; overflow: visible !important; background: #fff !important; }
    #app .dxr { display: block !important; height: auto !important; overflow: visible !important; background: #fff !important; }
    #app .dxr-chrome, #app .dxr-rail, #app .dxr-hint, #app .dxr-pop, #app [data-dxr="loader"],
    #app .docx-comment-gutter, #app .docx-comment-leaders, #app [data-docx-comment-panel] { display: none !important; }
    #app .dxr-scroll { overflow: visible !important; height: auto !important; padding: 0 !important; background: none !important; }
    #app .dxr-surface, #app .docx-body-flow, #app .page-container {
      padding: 0 !important; margin: 0 !important; gap: 0 !important; background: none !important; display: block !important;
      box-shadow: none !important; zoom: 1 !important; transform: none !important;
    }
    #app [data-docx-page-comments-row] { display: block !important; width: auto !important; }
    #app .page-box { box-shadow: none !important; margin: 0 !important; break-after: page; }
    #app .page-box:last-of-type { break-after: auto; }
    #app *:focus { outline: none !important; }
    /* The scroll area's edge shades are outside the pages' named @page boxes (docxodus-section-N, one a section's
       size): they made a blank page before the first page and after the last when the sizes differ. */
    #app .dxr-scroll::before, #app .dxr-scroll::after { display: none !important; content: none !important; }
    /* The comments don't print (their column is screen-only), so neither do their highlights. */
    #app span.comment-highlight[data-comment-id] { background: transparent !important; border-bottom-color: transparent !important; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
// dAHKxodus: Docxodus's ribbon editor in a WebView2 host (dAHKxodus.cs).
// Messages to the host:   ready, opened, openFailed, saved (the document's bytes: Save, or the host's "save" with its
//                         id), dirty (the document changed or was saved), newRequest, openRequest, openRecent (a
//                         path), saveAsRequest, settingsRequest, view (the view changed), drop (files dropped on the
//                         page, as additional objects), ahk (a call to an AutoHotkey function), log
// Messages from the host: open (a document's bytes), blank (a new document), save (send the bytes back, with the
//                         id), savedOk (the file is written), recent (the recent documents), ui (labels in the user's
//                         language), user (a new name and initials), ahkResult, measure
// The host owns the files: New, Open, the Recent list and Save go to it, and it asks to save a changed document
// before replacing or closing it (window.dax.isDirty()).
// The loading overlay stays up from the start until the document is in, and a long document mounts window by window
// (ribbon.openAsync), so the overlay keeps moving and shows how far the mount has got.
// The editing session runs in the host, natively in .NET (nativeSessionBridge): the page's WASM engine starts too but
// serves only the rarely used rest of its exports. ?engine=wasm runs the session in the page; ?verify=1 runs it in both.
const tPage = performance.now();
const { mountRibbon, initialize, getWasmExports, parseHeadlineCaseLists, DEFAULT_HEADLINE_CASE_TEXT } = await import("./node_modules/docxodus/dist/embed.bundle.js");
const tImported = performance.now();

const host = window.chrome?.webview;
const post = (m) => host?.postMessage(m);
const ms = (t) => Math.round(t);
const frame = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));

const toB64 = (bytes) => {
  if (bytes.toBase64) return bytes.toBase64();
  let s = "";
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
};
const fromB64 = (b64) => Uint8Array.fromBase64 ? Uint8Array.fromBase64(b64) : Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));

// --- The native engine: the editing session runs in the host (.NET), not in this page's WASM runtime.
// Returns an object with the same functions as the WASM export DocxSessionBridge, each a synchronous call to the
// host's engine object (dAHKxodus.cs, EngineHost), or null when the host has none. The host's manifest gives
// every method's parameter and return types: bytes cross as base64, a null result or an exception as "\0..." text.
function nativeSessionBridge() {
  const engine = host?.hostObjects?.sync?.engine;
  if (!engine) return null;
  const manifest = JSON.parse(engine.Manifest());
  const bridge = {};
  for (const [method, sig] of Object.entries(manifest)) {
    const [cls, name] = method.split(".");
    if (cls !== "DocxSessionBridge") continue;
    const bytesAt = sig.p.map((t) => t.startsWith("bytes"));
    const ret = sig.r.replace("?", "");
    bridge[name] = (...args) => {
      const wire = [];
      for (let i = 0; i < sig.p.length; i++) {
        const a = args[i];
        wire.push(a === undefined || a === null ? null : bytesAt[i] ? toB64(a) : a);
      }
      const r = engine.Call(method, JSON.stringify(wire));
      if (r.charCodeAt(0) === 0) {
        if (r.startsWith("\0error:")) throw new Error(r.slice(7));
        return ret === "void" ? undefined : null;
      }
      switch (ret) {
        case "void": return undefined;
        case "int": case "long": case "double": return Number(r);
        case "bool": return r === "true";
        case "bytes": return fromB64(r);
        default: return r;
      }
    };
  }
  return bridge;
}

// ?verify=1 (DAHKXODUS_VERIFY=1): every session call runs on the native engine AND on the page's WASM engine, which
// holds a twin of each session; the editor gets the native answer, and the two answers are compared. A test of the
// native engine, not for use: the open takes the time of both. Logs counts, method names and offsets only (no text).
function verifyingBridge(native, wasm) {
  const twin = new Map();                       // native session/transaction handle -> the WASM one
  const tally = { calls: 0, same: 0, opened: 0, differ: new Map() };
  const same = (a, b) => {
    if (a instanceof Uint8Array && b instanceof Uint8Array) return a.length === b.length && a.every((x, i) => x === b[i]);
    return a === b || (a == null && b == null);
  };
  const where = (a, b) => {                     // where two answers part, without their content
    if (typeof a !== "string" || typeof b !== "string") return `${a?.constructor?.name ?? a} vs ${b?.constructor?.name ?? b}`;
    let i = 0;
    while (i < a.length && a[i] === b[i]) i++;
    return `lengths ${a.length}/${b.length}, first difference at ${i}`;
  };
  const out = {};
  for (const name of Object.keys(native)) {
    const w = wasm[name];
    out[name] = (...args) => {
      const r = native[name](...args);
      if (typeof w !== "function") return r;
      const wargs = args.map((a, i) => (i === 0 && typeof a === "number" && twin.has(a) ? twin.get(a) : a));
      let wr, threw = null;
      try { wr = w(...wargs); } catch (e) { threw = e; }
      tally.calls++;
      if (/^(Open|Begin)/.test(name) && typeof r === "number" && typeof wr === "number") { twin.set(r, wr); tally.opened++; }
      else if (!threw && same(r, wr)) tally.same++;
      else {
        const d = tally.differ.get(name) ?? { n: 0, first: threw ? "WASM threw " + threw.message : where(r, wr) };
        d.n++;
        tally.differ.set(name, d);
      }
      return r;
    };
  }
  out.verifyReport = () => `${tally.calls} calls on both engines: ${tally.opened} opened twin sessions, ${tally.same} answered identically` +
    (tally.differ.size ? "; differ: " + [...tally.differ].map(([k, d]) => `${k} ${d.n}x (${d.first})`).join("; ") : "");
  return out;
}

// --- The AutoHotkey bridge: callAhk("LegalDate") resolves with what the AHK function returned.
const pending = new Map();
let nextId = 0;
function callAhk(fn, arg = "") {
  return new Promise((resolve, reject) => {
    const id = ++nextId;
    pending.set(id, { resolve, reject });
    post({ type: "ahk", id, fn, arg: String(arg) });
  });
}
window.callAhk = callAhk;

let ribbon;
let docName = "untitled.docx";

// Opens with the overlay narrating the mount. Also measures how responsive the page stayed: the longest gap between
// painted frames, and how long until the first window of paragraphs landed (the session open before it is one call).
// Paragraphs per window: each window is one engine call with a fixed cost (~55 ms at Docxodus's default of 24, which
// made a 9,500-paragraph document take 23 s instead of 4). ?window=N overrides it (DAHKXODUS_WINDOW in the host).
const WINDOW_SIZE = Number(new URLSearchParams(location.search).get("window")) || 400;
async function openBytes(bytes, name) {
  docName = name;
  const loader = ribbon.loader;
  loader.show();
  loader.stage({ title: "Opening " + name, copy: "Reading the document and laying out its paragraphs.", progress: 40, label: "Reading document" });
  await frame(); // let the new copy paint before the engine call
  let watching = true, last = performance.now(), longestGap = 0;
  const watch = (now) => { longestGap = Math.max(longestGap, now - last); last = now; if (watching) requestAnimationFrame(watch); };
  requestAnimationFrame(watch);
  // (Profiling: time spent in each engine call during the open.)
  const bridge = ribbon.exports?.DocxSessionBridge, calls = {}, originals = {};
  if (bridge) for (const k of Object.keys(bridge)) {
    if (typeof bridge[k] !== "function") continue;
    originals[k] = bridge[k];
    bridge[k] = (...a) => { const s = performance.now(); try { return originals[k](...a); } finally { const c = calls[k] ??= { n: 0, ms: 0 }; c.n++; c.ms += performance.now() - s; } };
  }
  const t = performance.now();
  let firstWindow = 0;
  openInContinuousView();
  await ribbon.openAsync(bytes, name, {
    windowSize: WINDOW_SIZE,
    onProgress: (mounted, total) => {
      if (!firstWindow) firstWindow = performance.now() - t;
      loader.progress(40 + Math.round(55 * mounted / Math.max(total, 1)), `${mounted.toLocaleString()} of ${total.toLocaleString()} paragraphs`);
    },
  });
  const opened = performance.now();
  watching = false;
  if (bridge) {
    Object.assign(bridge, originals);
    const engine = Object.values(calls).reduce((s, c) => s + c.ms, 0);
    const top = Object.entries(calls).sort((a, b) => b[1].ms - a[1].ms).slice(0, 6).map(([k, c]) => `${k} ${c.n}x ${ms(c.ms)} ms`);
    post({ type: "log", text: `open profile (${engineKind}): engine ${ms(engine)} ms of ${ms(opened - t)} ms; ${top.join("; ")}` });
    if (engineKind.startsWith("native")) post({ type: "engineStats" });
  }
  loader.done();
  await frame();
  const painted = performance.now();
  const blocks = document.querySelectorAll("#app [data-anchor]").length;
  return { open: ms(opened - t), firstWindow: ms(firstWindow), longestGap: ms(longestGap), paint: ms(painted - opened), blocks };
}

// Insert AHK's answer at the caret, as typing would (the editor commits it like any other input).
async function insertFromAhk(fn) {
  const sel = window.getSelection();
  const range = sel && sel.rangeCount ? sel.getRangeAt(0).cloneRange() : null;
  const t = performance.now();
  const text = await callAhk(fn);
  const roundTrip = performance.now() - t;
  if (range) { sel.removeAllRanges(); sel.addRange(range); }
  document.execCommand("insertText", false, text);
  return { text, roundTrip: Math.round(roundTrip * 10) / 10 };
}

// The measure run's checks of milestone 1, through the page as the user's keys and clicks would go (no keys are sent
// to the desktop): typing undone and redone by Ctrl+Z / Ctrl+Shift+Z, then a comment and a picture, which the saved
// copy carries (its comment's date and initials, the picture's part in word/media: tests\check-saved.ps1).
async function editChecks() {
  const results = [...unchangedResults];
  const editable = () => Array.from(document.querySelectorAll('#app p[data-anchor][contenteditable="true"]'))
    .filter((p) => !p.closest("table") && p.textContent.trim().length > 0);
  const caretAtEnd = (el) => {
    el.focus();
    const r = document.createRange();
    r.selectNodeContents(el);
    r.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(r);
  };
  const ctrl = (key, shiftKey = false) => document.activeElement?.dispatchEvent(
    new KeyboardEvent("keydown", { key, ctrlKey: true, shiftKey, bubbles: true, cancelable: true }));
  const shows = (text) => document.querySelector("#app").textContent.includes(text);

  caretAtEnd(editable()[0]);
  document.execCommand("insertText", false, " daxtyped");
  ctrl("z");
  await frame();
  results.push(`Ctrl+Z ${shows("daxtyped") ? "FAILED" : "ok"}`);
  ctrl("z", true);
  await frame();
  results.push(`Ctrl+Shift+Z ${shows("daxtyped") ? "ok" : "FAILED"}`);
  ctrl("z");
  await frame();
  ctrl("y");
  await frame();
  results.push(`Ctrl+Y ${shows("daxtyped") ? "ok" : "FAILED"}`);

  caretAtEnd(editable()[0]);
  const comment = ribbon.editor.addComment("A comment from the measure run.");
  results.push(`comment ${comment ? "ok" : "FAILED"}`);
  caretAtEnd(editable()[0]);
  const png = "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==";
  results.push(`picture ${ribbon.editor.insertImage(png) ? "ok" : "FAILED"}`);
  document.activeElement?.blur?.();
  await frame();

  // The host's own save, as before closing a changed document: it asks for the bytes, writes them (a measure run
  // writes beside its copy) and answers savedOk, after which the document reads as unchanged.
  results.push(`changed ${window.dax.isDirty() ? "ok" : "FAILED"}`);
  // Autosave of the changed document: the host's recovery copy is written (a .docx), and the document still reads
  // as changed (the copy is not a save); after the save below, the copy is gone.
  results.push(`autosave ${(await measureAsk("measureAutosave", "autosave")) ? "ok" : "FAILED"}`);
  results.push(`still changed after autosave ${window.dax.isDirty() ? "ok" : "FAILED"}`);
  const savedOk = new Promise((resolve) => { savedOkWaiters.push(resolve); setTimeout(() => resolve(null), 10000); });
  post({ type: "measureSave" });
  results.push(`host save ${(await savedOk) ? "ok" : "FAILED"}`);
  results.push(`unchanged after save ${window.dax.isDirty() ? "FAILED" : "ok"}`);
  results.push(`recovery copy gone after save ${(await measureAsk("measureRecoveryState", "recoveryState")) ? "ok" : "FAILED"}`);
  return results.join(", ");
}
const savedOkWaiters = [];

// (Measure runs) A question to the host, answered by "measureReply" with the same `what`: true, false, or null after
// 20 s (or `wait` ms) without an answer.
const measureWaiters = new Map();
function measureAsk(type, what, wait = 20000) {
  return new Promise((resolve) => {
    measureWaiters.set(what, resolve);
    setTimeout(() => { if (measureWaiters.delete(what)) resolve(null); }, wait);
    post({ type });
  });
}

// Scripts' TextChanged event (Doc.ahk): when typing pauses, and after a command.
let textChangedTimer = 0;
function textChanged() {
  clearTimeout(textChangedTimer);
  textChangedTimer = setTimeout(() => post({ type: "textChanged" }), 300);
}
document.addEventListener("input", (e) => { if (e.target?.closest?.("#app [data-anchor]")) textChanged(); }, true);

// --- The recovery copy (the host's autosave): the document's bytes as Save would write them, without saving. Not in
// the middle of a word: the editor commits typing for them, so this waits until typing has paused (1.5 s, at most
// 10 s).
let lastInput = 0;
document.addEventListener("input", () => { lastInput = performance.now(); }, true);
async function snapshot(id) {
  const until = performance.now() + 10000;
  while (performance.now() - lastInput < 1500 && performance.now() < until) await new Promise((r) => setTimeout(r, 250));
  try {
    const bytes = ribbon?.save();
    post(bytes ? { type: "snapshot", id, b64: toB64(bytes) } : { type: "snapshot", id, error: "nothing is open" });
  } catch (err) {
    post({ type: "snapshot", id, error: String(err?.message ?? err) });
  }
}

// (Measure runs) The host's picture of the editor as it shows, logs\<name>.png; resolves when it is written.
const captureWaiters = new Map();
function capture(name) {
  return new Promise((resolve) => {
    captureWaiters.set(name, resolve);
    setTimeout(() => { captureWaiters.delete(name); resolve(); }, 5000);
    post({ type: "capture", name });
  });
}

// The File tab, as a click would: the menu opens with the ribbon's commands and the host's (Settings, Close), a
// picture of it is taken (logs\measure-file-menu.png), and Escape closes it.
async function fileMenuChecks() {
  const button = ribbon.control("filebutton"), menu = ribbon.control("filemenu");
  if (!button || !menu) return "no File tab FAILED";
  button.dispatchEvent(new MouseEvent("mousedown", { bubbles: true, cancelable: true }));
  button.click();
  await frame();
  const shown = Array.from(menu.querySelectorAll('button[role="menuitem"]'))
    .filter((b) => b.offsetParent !== null).map((b) => b.querySelector("span")?.textContent ?? "");
  const opened = menu.hasAttribute("data-open");
  await capture("measure-file-menu");
  menu.querySelector("button")?.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
  await frame();
  // (the ribbon's own items in the language in use: the host's table for the ribbon, or English)
  const label = (english) => ui.ribbon?.[english] ?? english;
  const want = [label("New"), label("Open…"), label("Save"), label("Save As…"), ui.settings, ui.close];
  const ok = opened && want.every((w) => shown.includes(w)) && !menu.hasAttribute("data-open");
  const tabs = Array.from(document.querySelectorAll("#app .dxr-tab:not([hidden])")).map((t) => t.textContent.trim()).join(" | ");
  return `${opened ? "opened" : "NOT opened"}, items ${shown.join(" | ")}, ${menu.hasAttribute("data-open") ? "still open" : "closed by Escape"} ${ok ? "ok" : "FAILED"}; tabs ${tabs}`;
}

// Macro recording, as keys and clicks would: Ctrl+Shift+R starts it (the red mark shows); typing, a Backspace right
// after typing, Enter, Bold, a style and Ctrl+E become Doc lines; Ctrl+Shift+R stops and the host writes the script
// (logs\measure-recorded.ahk, no dialog); then a new document replays it (dAHKxodus.ahk runs it, as a macro) and comes
// out as the recorded one did: the same text, the same style where the caret ends.
async function recordingChecks() {
  const out = [];
  const key = (target, k, mods = {}) => target.dispatchEvent(new KeyboardEvent("keydown", { key: k, bubbles: true, cancelable: true, ...mods }));
  const reply = (what, ms) => new Promise((resolve) => {
    measureWaiters.set(what, resolve);
    setTimeout(() => { if (measureWaiters.delete(what)) resolve(null); }, ms);
  });
  const blank = async (name) => {
    openInContinuousView();
    ribbon.openBlank(name);
    caretAtStart(); relabel();
    await frame();
  };
  await blank("record.docx");
  key(document.activeElement ?? window, "R", { ctrlKey: true, shiftKey: true });    // (from the document, as a key is: the ribbon's Ctrl+R must not take it)
  await frame();
  const mark = document.querySelector(".dax-recmark");
  out.push(`started ${recorder.on && mark && !mark.hidden ? "ok" : "FAILED"}`);
  document.execCommand("insertText", false, "Recorded linex");
  key(document.activeElement, "Backspace");
  document.execCommand("delete");
  key(document.activeElement, "Enter");
  await frame();
  document.execCommand("insertText", false, "Second");
  document.querySelector('#app button[data-cmd="bold"]')?.click();
  const style = ribbon.control("style");
  const heading = Array.from(style?.options ?? []).find((o) => o.value === "Heading1")?.value;
  if (style && heading) { style.value = heading; style.dispatchEvent(new Event("change", { bubbles: true })); }
  key(document.activeElement, "e", { ctrlKey: true });
  await frame();
  const recorded = { text: ribbon.exec("text"), style: ribbon.exec("styleAtCaret") };
  const written = reply("recorded", 10000);
  key(document.activeElement ?? window, "R", { ctrlKey: true, shiftKey: true });    // (from the document, as a key is: the ribbon's Ctrl+R must not take it)
  const lines = recorder.lines.slice();
  const want = ['Doc.InsertText("Recorded line`nSecond")', "Doc.Bold()", 'Doc.Style("Heading1")', 'Doc.Align("center")'];
  out.push(`lines ${JSON.stringify(lines) === JSON.stringify(want) ? "ok" : `FAILED (${lines.join(" | ")})`}, stopped ${!recorder.on && mark?.hidden ? "ok" : "FAILED"}`);
  out.push(`written ${(await written) ? "ok" : "FAILED"}`);
  // The replay: a new document, the macro run by dAHKxodus.ahk, as the Macros tab runs one.
  await blank("replay.docx");
  post({ type: "measureRunRecorded" });
  const until = performance.now() + 20000;
  while (performance.now() < until && ribbon.exec("text") !== recorded.text) await new Promise((r) => setTimeout(r, 200));

}

async function hotkeyChecks() {

  out.push(`taken list ${taken.some((t) => t.keys === "Ctrl+B") && taken.some((t) => t.keys === "Ctrl+Shift+P") ? "ok" : `FAILED (${taken.map((t) => t.keys).join(" ")})`}`);

// Format Painter: Ctrl+Shift+C / Ctrl+Shift+V paint the word at the caret as one undo step, the brush paints once on a
// click, and the palette lists the brush.
async function formatPainterChecks() {
  const out = [];
  openInContinuousView();
  ribbon.openBlank("painter.docx");
  caretAtStart(); relabel();
  await frame();
  await ribbon.exec("pasteText", { text: "Alpha beta\nGamma delta" });
  await frame();
  const blocks = () => Array.from(document.querySelectorAll('#app [data-anchor][contenteditable="true"]'));
  const key = (el, k, extra = {}) => el.dispatchEvent(new KeyboardEvent("keydown", { key: k, bubbles: true, cancelable: true, ...extra }));
  // The text node holding `word` in paragraph `i`, and its offset there.
  const find = (i, word) => {
    const walker = document.createTreeWalker(blocks()[i], NodeFilter.SHOW_TEXT);
    for (let n = walker.nextNode(); n; n = walker.nextNode()) {
      const at = n.textContent.indexOf(word);
      if (at >= 0) return { n, at };
    }
    return null;
  };
  const place = (i, word, length) => {
    const hit = find(i, word);
    if (!hit) return;
    blocks()[i].focus();
    const range = document.createRange();
    range.setStart(hit.n, hit.at + (length ? 0 : 1));
    range.setEnd(hit.n, hit.at + (length ? word.length : 1));
    getSelection().removeAllRanges();
    getSelection().addRange(range);
  };
  const bold = (i, word) => { const hit = find(i, word); return !!hit && Number(getComputedStyle(hit.n.parentElement).fontWeight) >= 600; };
  place(0, "Alpha", true);
  ribbon.exec("bold", { on: true });
  await frame();
  place(0, "Alpha");
  key(blocks()[0], "C", { ctrlKey: true, shiftKey: true });
  place(1, "delta");
  key(blocks()[1], "V", { ctrlKey: true, shiftKey: true });
  await frame();
  out.push(`keys ${bold(1, "delta") && !bold(1, "Gamma") ? "ok" : "FAILED"}`);
  ribbon.exec("undo");
  await frame();
  out.push(`undo ${!bold(1, "delta") && bold(0, "Alpha") ? "ok" : "FAILED"}`);
  place(0, "Alpha");
  const brush = document.querySelector('#app [data-dxr="formatpainter"]');
  brush?.click();
  out.push(`brush ${brush?.getAttribute("aria-pressed") === "true" ? "ok" : "FAILED"}`);
  place(1, "Gamma");
  blocks()[1].dispatchEvent(new MouseEvent("mouseup", { bubbles: true, button: 0 }));
  await frame();
  await frame();
  out.push(`painted ${bold(1, "Gamma") && brush?.getAttribute("aria-pressed") === "false" ? "ok" : "FAILED"}`);
  const listed = paletteItems().filter((i) => i.key === "b:formatpainter");
  out.push(`palette ${listed.length === 1 ? "ok" : `FAILED (${listed.length})`}`);
  return out.join(", ");
}

  const key = (target, k, mods = {}) => target.dispatchEvent(new KeyboardEvent("keydown", { key: k, bubbles: true, cancelable: true, ...mods }));
  caretAtStart();
  const block = document.activeElement;
  key(document.activeElement ?? window, "P", { ctrlKey: true, shiftKey: true });
  await frame();
  const box = document.querySelector(".dax-palette");
  out.push(`opened ${box && palette && document.activeElement === palette.input ? "ok" : "FAILED"}`);
  if (!box || !palette) return out.join(", ");
  await new Promise((r) => setTimeout(r, 300));    // (the host's macro list)
  const type = async (text) => {
    palette.input.value = text;
    palette.input.dispatchEvent(new Event("input", { bubbles: true }));
    await frame();
    return palette.shown();
  };
  const all = await type("");
  out.push(`${all.length} items ${all.length > 80 ? "ok" : "FAILED"}`);
  const boldName = controlName(document.querySelector('#app [data-cmd="bold"]'));
  const bold = await type(boldName.toLowerCase());
  out.push(`"${boldName.toLowerCase()}" first: ${bold[0]?.name} @ ${bold[0]?.where} ${bold[0]?.key === "b:bold" ? "ok" : "FAILED"}`);
  const macroItem = all.find((i) => i.key.startsWith("m:") && i.key.endsWith("Insert date.ahk"));
  out.push(`macro ${macroItem ? `"${macroItem.name}" ok` : "Insert date MISSING FAILED"}`);
  const marginItem = all.find((i) => i.key.startsWith("s:margins:"));
  out.push(`list choice ${marginItem ? `"${marginItem.name}" @ ${marginItem.where} ok` : "margins MISSING FAILED"}`);
  const trackItem = all.find((i) => i.key === "c:trackchanges");
  out.push(`switch ${trackItem ? `"${trackItem.name}" ${trackItem.on ? "(on)" : "(off)"} ok` : "Track changes MISSING FAILED"}`);
  const fitName = controlName(ribbon.control("zoomfit"));
  const fit = await type(fitName);
  await capture("measure-palette");
  out.push(`"${fitName}" first ${fit[0]?.key === "b:zoomfit" ? "ok" : `FAILED (${fit[0]?.key})`}`);
  if (ribbon.editor.fitsPageWidth) ribbon.exec("zoom", { scale: 1 });    // (so the command has something to do)
  key(palette.input, "Enter");
  await frame();
  out.push(`Enter ran it ${!palette && ribbon.editor.fitsPageWidth ? "ok" : "FAILED"}, focus back in the document ${document.activeElement === block ? "ok" : "FAILED"}`);
  key(document.activeElement ?? window, "P", { ctrlKey: true, shiftKey: true });
  await frame();
  await type("zzzz nothing");
  const none = document.querySelector(".dax-palette .dax-empty")?.textContent;
  key(palette.input, "Escape");
  await frame();
  out.push(`no match says "${none}" ${none === ui.paletteNone ? "ok" : "FAILED"}, Escape closed it ${palette || document.querySelector(".dax-palette") ? "FAILED" : "ok"}`);
  applyView(before);
  await frame();
  return out.join(", ");
}

// The page's own ribbon parts, as clicks would: no Save in the title bar, Settings' gear there instead; the Macros tab
// and its list (Escape closes it); Page width makes the page as wide as the window, and the view reports "width".
async function ribbonChecks() {
  const out = [];
  const save = ribbon.control("save"), gear = document.querySelector(".dax-settings");
  out.push(`Save in title bar ${save && save.offsetParent === null ? "hidden ok" : "SHOWN FAILED"}`);
  out.push(`gear ${gear && gear.offsetParent !== null && gear.textContent === "⚙" ? "ok" : "FAILED"}`);
  const tab = document.querySelector('.dxr-tab[data-tab="dax-macros"]');
  tab?.click();
  await frame();
  const panel = document.querySelector('.dxr-panel[data-panel="dax-macros"]');
  const button = panel?.querySelector(".dax-macrobutton");
  button?.click();
  await frame();
  const menu = document.querySelector(".dax-macromenu");
  const items = Array.from(menu?.querySelectorAll('button[role="menuitem"]') ?? []).map((b) => b.textContent);
  const opened = !!menu?.hasAttribute("data-open");
  await capture("measure-macros");
  document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
  await frame();
  out.push(`Macros tab ${tab && panel?.hasAttribute("data-active") ? "ok" : "FAILED"}, list ${opened ? "opened" : "NOT opened"} `
    + `(${items.join(" | ")}) ${opened && items.includes(ui.ahk) ? "ok" : "FAILED"}, ${menu?.hasAttribute("data-open") ? "still open FAILED" : "closed by Escape ok"}`);
  const before = viewState();
  document.querySelector('.dxr-tab[data-tab="view"]')?.click();
  ribbon.control("zoomfit")?.click();
  await frame();
  // (the room the page has: the surface's, less its padding, which leaves the comments their column when they show)
  const surface = document.querySelector("#app [data-dxr-surface]"), cs = getComputedStyle(surface);
  const room = surface.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  // (the widest page is the one that fits: a landscape section's, in a portrait document)
  const sheets = Array.from(document.querySelectorAll("#app .page-box"));
  if (sheets.length === 0) sheets.push(document.querySelector("#app .docx-body-flow"));
  const width = Math.max(0, ...sheets.map((e) => e?.getBoundingClientRect().width ?? 0));
  const fits = ribbon.editor.fitsPageWidth && width > room - 40 && width <= room;
  out.push(`Page width: page ${Math.round(width)} px in ${Math.round(room)} px, zoom ${Math.round(ribbon.editor.requestedZoom * 100)}%, `
    + `view says ${JSON.stringify(viewState().zoom)} ${fits && viewState().zoom === "width" ? "ok" : "FAILED"}`);
  // One page: a whole page in view (its height within the scrolling area)
  ribbon.control("zoomonepage")?.click();
  await frame();
  const box = document.querySelector("#app .page-box") ?? document.querySelector("#app .docx-body-flow");
  const area = document.querySelector("#app .dxr-scroll").clientHeight;
  const high = box?.getBoundingClientRect().height ?? 0;
  const paged = !!document.querySelector("#app .page-box");
  const whole = ribbon.editor.fitsOnePage && (!paged || high <= area);
  out.push(`One page: ${paged ? `page ${Math.round(high)} px high in ${area} px` : "continuous view"}, zoom ${Math.round(ribbon.editor.requestedZoom * 100)}%, `
    + `view says ${JSON.stringify(viewState().zoom)} ${whole && viewState().zoom === "page" ? "ok" : "FAILED"}`);
  applyView({ ...before, zoom: typeof before.zoom === "string" ? 1 : before.zoom ?? 1 });
  document.querySelector('.dxr-tab[data-tab="home"]')?.click();
  return out.join("; ");
}

// The ribbon's Numbering and Increase indent buttons, as clicks would: three neighbouring paragraphs numbered, the
// middle one indented. Word shows "1.", "a.", "2." (a nested level steps to the next number format).
async function numberingChecks() {
  const blocks = () => Array.from(document.querySelectorAll('#app [data-anchor][contenteditable="true"]'))
    .filter((p) => !p.closest("table") && p.textContent.trim().length > 0);
  const all = blocks();
  let run = -1;
  for (let i = 0; i + 2 < all.length && run < 0; i++)
    if (all[i].nextElementSibling === all[i + 1] && all[i + 1].nextElementSibling === all[i + 2]
        && ![all[i], all[i + 1], all[i + 2]].some((p) => p.dataset.anchor?.startsWith("li"))) run = i;
  if (run < 0) return "no three neighbouring paragraphs";
  const keys = all.slice(run, run + 3).map((p) => p.textContent.trim().slice(0, 24));
  const find = (key) => blocks().find((p) => p.textContent.includes(key));
  const click = (selector) => ribbon.element?.querySelector?.(selector) ?? document.querySelector(`#app ${selector}`);
  for (const key of keys) {
    const p = find(key);
    p.focus();
    click('button[data-list="decimal"]').click();
    await frame();
  }
  find(keys[1]).focus();
  click('button[data-indent="720"]').click();
  await frame();
  const labels = keys.map((key) => {
    const text = find(key)?.textContent.trim() ?? "";
    return text.slice(0, Math.max(0, text.indexOf(key))).trim() || "(none)";
  });
  const ok = labels[0] === "1." && labels[1] === "a." && labels[2] === "2.";
  return `labels ${labels.join(" | ")} ${ok ? "ok" : "FAILED"}`;
}

// The ribbon's Table button, as a click would: the caret in a paragraph, the grid opened, a cell pressed (2 rows, 3
// columns). In page view and in continuous view; reports the tables in the document before and after, and what the
// ribbon's rail and status say.
async function tablePickerChecks() {
  const out = [];
  for (const paginated of [true, false]) {
    applyView({ paginated });
    await frame();
    const block = Array.from(document.querySelectorAll('#app p[data-anchor][contenteditable="true"]'))
      .find((p) => !p.closest("table") && p.textContent.trim().length > 0);
    if (!block) { out.push(`${paginated ? "page" : "continuous"}: no paragraph`); continue; }
    block.focus();
    const r = document.createRange();
    r.selectNodeContents(block); r.collapse(false);
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    const before = document.querySelectorAll("#app table").length;
    const button = ribbon.control("table");
    button.dispatchEvent(new MouseEvent("mousedown", { bubbles: true, cancelable: true }));
    button.click();
    const picker = ribbon.control("gridpicker");
    const opened = picker?.hasAttribute("data-open");
    const cell = ribbon.control("gridcells")?.querySelector('[data-r="1"][data-c="2"]');
    let error = "";
    try {
      cell?.dispatchEvent(new PointerEvent("pointerover", { bubbles: true }));
      cell?.dispatchEvent(new MouseEvent("mousedown", { bubbles: true, cancelable: true }));
    } catch (err) { error = " error " + err.message; }
    await frame();
    const after = document.querySelectorAll("#app table").length;
    out.push(`${paginated ? "page" : "continuous"}: picker ${opened ? "opened" : "NOT opened"}, cell ${cell ? "found" : "MISSING"}, `
      + `tables ${before} -> ${after} ${after > before ? "ok" : "FAILED"}, closed ${picker?.hasAttribute("data-open") ? "no" : "yes"}, `
      + `rail "${ribbon.control("railOp")?.textContent ?? ""}", status "${ribbon.control("status")?.textContent ?? ""}"${error}`);
  }
  // A new blank document: the grid pressed before the document was ever clicked, then with the caret in its paragraph;
  // then (the user's case) in page view. Tables counted only when they show (a size, and not inside a hidden element).
  // (showing: a size, laid out, and its cells' borders drawn: a borderless empty table looks like nothing at all)
  const shown = () => Array.from(document.querySelectorAll("#app table"))
    .filter((t) => {
      const b = t.getBoundingClientRect(), td = t.querySelector("td, th");
      return b.width > 0 && b.height > 0 && t.offsetParent !== null && !!td && getComputedStyle(td).borderTopStyle !== "none";
    });
  const describe = (t) => {
    if (!t) return "none";
    const b = t.getBoundingClientRect();
    const chain = [];
    for (let e = t.parentElement; e && e.id !== "app" && chain.length < 5; e = e.parentElement)
      chain.push(`${e.tagName.toLowerCase()}${e.className ? "." + String(e.className).trim().split(/\s+/).join(".") : ""}`);
    const td = t.querySelector("td, th");
    const cs = td ? getComputedStyle(td) : null;
    return `${Math.round(b.width)}x${Math.round(b.height)} at ${Math.round(b.left)},${Math.round(b.top)}, `
      + `${t.offsetParent ? "" : "NOT "}laid out, in ${chain.join(" < ")}; ${t.rows?.length} rows, ${td ? td.parentElement.cells.length : 0} cells a row, `
      + `cell border ${cs ? `${cs.borderTopStyle} ${cs.borderTopWidth} ${cs.borderTopColor}` : "-"}, cell ${td ? Math.round(td.getBoundingClientRect().height) : 0}px high, `
      + `borderless option ${ribbon.control("gridborderless")?.checked}; html ${t.outerHTML.slice(0, 300).replace(/\s+/g, " ")}`;
  };
  for (const [caret, paginated] of [[false, false], [true, false], [false, true]]) {
    savedView.paginated = paginated;
    openInContinuousView();
    ribbon.openBlank("blank.docx");
    applyView(savedView); caretAtStart(); relabel();
    await frame();
    window.getSelection().removeAllRanges();
    document.activeElement?.blur?.();
    if (caret) {
      const p = document.querySelector('#app [data-anchor][contenteditable="true"]');
      p?.focus();
      const r = document.createRange(); r.selectNodeContents(p); r.collapse(true);
      window.getSelection().addRange(r);
    }
    const before = document.querySelectorAll("#app table").length;
    ribbon.control("table").click();
    const cell = ribbon.control("gridcells")?.querySelector('[data-r="1"][data-c="2"]');
    cell?.dispatchEvent(new MouseEvent("mousedown", { bubbles: true, cancelable: true }));
    await frame();
    const after = document.querySelectorAll("#app table").length;
    const visible = shown();
    out.push(`blank${paginated ? " in page view" : ""}, ${caret ? "caret in it" : "never clicked"}: tables ${before} -> ${after}, `
      + `${visible.length} showing ${visible.length > 0 ? "ok" : "FAILED"}, `
      + `closed ${ribbon.control("gridpicker")?.hasAttribute("data-open") ? "no" : "yes"}, rail "${ribbon.control("railOp")?.textContent ?? ""}"; `
      + `table: ${describe(document.querySelector("#app table"))}`);
    if (paginated) await capture("measure-table-page-view");
  }
  savedView.paginated = false;
  return out.join("; ");
}

// Before the measure run edits anything: a document only opened (and looked at: the deferred work after an open has
// run, the caret is put in it and taken out again) has no changes, so closing it must not ask to save.
const unchangedResults = [];
async function unchangedChecks() {
  const state = () => `version ${ribbon.editor?.version} saved ${ribbon.savedVersion}, typed ${ribbon.typed} saved ${ribbon.savedTyped}`;
  await new Promise((r) => setTimeout(r, 1500));
  unchangedResults.push(`unchanged after open ${window.dax.isDirty() ? `FAILED (${state()})` : "ok"}`);
  const block = document.querySelector('#app [data-anchor][contenteditable="true"]');
  block.focus();
  await frame();
  block.blur();
  await frame();
  unchangedResults.push(`unchanged after a click ${window.dax.isDirty() ? `FAILED (${state()})` : "ok"}`);
  // The view as settings restore it (page view, zoom, comments and the rail switched), then back: not a change.
  const before = viewState();
  applyView({ paginated: !before.paginated, zoom: 1.5, comments: !before.comments, rail: !before.rail });
  await frame();
  const switched = viewState();
  const applied = switched.paginated !== before.paginated && Math.abs(switched.zoom - 1.5) < 1e-6
    && switched.comments !== before.comments && switched.rail !== before.rail;
  applyView(before);
  await frame();
  unchangedResults.push(`view restored ${applied ? "ok" : `FAILED (${JSON.stringify(switched)})`}`);
  unchangedResults.push(`unchanged after view changes ${window.dax.isDirty() ? `FAILED (${state()})` : "ok"}`);
}

// The ribbon's text in the user's language: its own (lang\<code>.ribbon.json, from the host; {} is English), and the
// help line under it, which the host gives whole (a sentence translated word by word would read badly). Again after
// each open: the ribbon rebuilds some lists then (the styles).
function relabel() {
  if (!ribbon) return;
  ribbon.setLabels(ui.ribbon ?? {});
  if (ui.units) ribbon.setMeasurementUnit(ui.units);    // the Paragraph dialog's indents: "in" or "cm" (lang\<code>.json)
  // Legal numbering's key (AhkWord's), shown where the palette reads a control's keys: its title's end.
  const legal = document.querySelector('#app [data-dxr="legallist"]');
  if (legal && !legal.title.endsWith("(Ctrl+Shift+G)")) legal.title += " (Ctrl+Shift+G)";
  const hint = document.querySelector("#app [data-dxr-hint]");
  if (hint && ui.hint) hint.innerHTML = ui.hint;    // (the host's own text, from lang\<code>.json)
  // The continuous view's section-break line (the editor's CSS, through custom properties).
  const breakLines = { nextPage: "Next page", continuous: "Continuous", evenPage: "Even page", oddPage: "Odd page", nextColumn: "Next column" };
  for (const [type, name] of Object.entries(breakLines)) {
    const text = ui.ribbon?.[`Section break (${name})`];
    if (text) document.documentElement.style.setProperty(`--docx-section-break-${type}`, JSON.stringify(text));
    else document.documentElement.style.removeProperty(`--docx-section-break-${type}`);
  }
}

// --- Printing and PDF: the host asks (preparePrint) and prints this page; the print CSS above shows the pages only.
// Pages exist in page view only, and are measured at 100%: the view and zoom are set for it, and put back after
// (printDone from the host, or the browser's afterprint when its print dialog closes).
let viewBeforePrint = null;
async function preparePrint(id) {
  try {
    if (!ribbon?.editor) throw new Error("nothing is open");
    if (!viewBeforePrint) viewBeforePrint = viewState();
    applyView({ paginated: true, zoom: 1 });
    // (the pages are laid out over a few frames; wait until their count stops changing, at most 3 s)
    let count = -1, until = performance.now() + 3000;
    while (performance.now() < until) {
      await frame();
      const now = document.querySelectorAll("#app .page-box").length;
      if (now > 0 && now === count) break;
      count = now;
    }
    const pages = Array.from(document.querySelectorAll("#app .page-box"));
    if (pages.length === 0) throw new Error("the page view has no pages");
    // (no caret: the paragraph it is in is washed on screen)
    document.activeElement?.blur?.();
    // Each page's size: the page view names each page box after its section (page: docxodus-section-N) with that
    // section's @page size, so landscape and other sizes print as they show. The first page's is also the default.
    const sizeOf = (p) => {
      const w = parseFloat(p.style.width), h = parseFloat(p.style.height);
      if (/pt$/.test(p.style.width) && /pt$/.test(p.style.height) && w > 0 && h > 0) return { w, h };
      const r = p.getBoundingClientRect();
      return { w: r.width * 0.75, h: r.height * 0.75 };
    };
    const sizes = pages.map(sizeOf);
    const widthIn = Math.round(sizes[0].w / 72 * 100) / 100, heightIn = Math.round(sizes[0].h / 72 * 100) / 100;
    let style = document.getElementById("dax-page-size");
    if (!style) { style = document.createElement("style"); style.id = "dax-page-size"; document.head.append(style); }
    style.textContent = `@page { size: ${widthIn}in ${heightIn}in; margin: 0; }`;
    post({ type: "printReady", id, widthIn, heightIn, pages: pages.length,
      sizes: sizes.map((s) => `${Math.round(s.w)}x${Math.round(s.h)}`).join(",") });
  } catch (err) {
    post({ type: "printReady", id, error: String(err?.message ?? err) });
  }
}
function printDone() {
  if (!viewBeforePrint) return;
  const before = viewBeforePrint;
  viewBeforePrint = null;
  applyView(before);
}
window.addEventListener("afterprint", () => printDone());

// The host's commands at the foot of the ribbon's File menu (after New, Open, Save, Save As and Recent).
const hostFileMenu = () => [
  { id: "print", label: ui.print ?? "Print…", title: ui.printTip ?? "", shortcut: "Ctrl+P", separatorBefore: true },
  { id: "pdf", label: ui.pdf ?? "Export to PDF…", title: ui.pdfTip ?? "" },
  { id: "copy", label: ui.copy ?? "Save a Copy As…", title: ui.copyTip ?? "" },
  { id: "settings", label: ui.settings, title: ui.settingsTip, shortcut: "Ctrl+,", separatorBefore: true },
  { id: "close", label: ui.close, title: ui.closeTip, separatorBefore: true },
];
// The macros on the Macros tab: an AutoHotkey function (class Bridge in dAHKxodus.ahk) whose answer is typed at the
// caret, then the scripts in the macros folders (the host lists them each time the list opens: "macros"), which
// dAHKxodus.ahk starts and which drive the editor through Doc.ahk.
let macroFiles = [];
let macroButtons = [];    // (the user's ribbon buttons: [{label, macro, path, title, hotkey}])
let renderMacroMenu = () => {};    // (addMacrosTab's: draws the open list again)
const macros = () => [
  { fn: "LegalDate", label: ui.ahk, title: ui.ahkTip },
  ...macroFiles.map((m, i) => ({
    path: m.path, label: m.label, user: !!m.user, separatorBefore: i === 0, hotkey: m.hotkey ?? "",
    title: (m.title || m.path) + (m.user ? "\n" + ui.macroDeleteTip : ""),
  })),
];
// (resolves once AutoHotkey has started the macro; false when it could not)
function runMacro(m, hotkey = "") {
  if (m.fn) return insertFromAhk(m.fn).then(() => true, (e) => { ribbon.setStatus("AHK: " + e.message); return false; });
  return new Promise((resolve, reject) => {
    const id = ++nextId;
    pending.set(id, { resolve, reject });
    post({ type: "runMacro", id, path: m.path, hotkey });
  }).then(() => true, (e) => { ribbon.setStatus("AHK: " + e.message); return false; });
}

// --- Macro hotkeys (the Macros tab's Hotkeys…, or the Save Macro dialog; settings.ini's [MacroHotkeys]): the keys
// run their macro while this window is active, taken before the ribbon and the editor see them (in the capture phase,
// registered before the palette's), so a hotkey the user gave a macro wins over dAHKxodus's own (the dialog asks first).
// The keys are named from the key's virtual-key code, as the host names them ("Ctrl+Alt+D", "Ctrl+Shift+F5", "F9"),
// so they match whatever the keyboard layout types.
const KEY_NAMES = { 45: "Insert", 46: "Delete", 36: "Home", 35: "End", 33: "PageUp", 34: "PageDown", 32: "Space",
  19: "Pause", 38: "Up", 40: "Down", 37: "Left", 39: "Right" };
function keyNameOf(e) {
  let code = e.keyCode;
  // (an event made by a script may have no keyCode: its code then, "KeyJ", "Digit2", "F5", "Numpad1")
  if (!code && e.code) {
    const c = /^(?:Key([A-Z])|Digit(\d))$/.exec(e.code);
    if (c) code = (c[1] ?? c[2]).charCodeAt(0);
    else if (/^F\d{1,2}$/.test(e.code)) code = 111 + parseInt(e.code.slice(1), 10);
    else if (/^Numpad\d$/.test(e.code)) code = 96 + parseInt(e.code.slice(6), 10);
  }
  if ((code >= 65 && code <= 90) || (code >= 48 && code <= 57)) return String.fromCharCode(code);
  if (code >= 112 && code <= 135) return "F" + (code - 111);
  if (code >= 96 && code <= 105) return "Num" + (code - 96);
  return KEY_NAMES[code] ?? null;
}
function chordOf(e) {
  const name = keyNameOf(e);
  if (!name) return "";
  return (e.ctrlKey ? "Ctrl+" : "") + (e.altKey ? "Alt+" : "") + (e.shiftKey ? "Shift+" : "") + name;
}
window.addEventListener("keydown", (e) => {
  if (e.repeat || e.isComposing || palette || !macroFiles.some((m) => m.hotkey)) return;
  const chord = chordOf(e);
  // (the same file name in both folders: the user's own, listed last)

// --- Macro recording (Ctrl+Shift+R; the Macros tab's Record button; the red mark in the title bar stops it), as
// AhkWord's: what the user types and the commands they run become the lines of a new macro, each a Doc call (Doc.ahk).
// The commands come from the ribbon's onCommand, which reports each one as exec takes it, whatever ran it (a button, a
// list, a shortcut, the palette, the editor's own Ctrl+B); typing from the document's input events, Enter and Backspace
// from its keys. What can't be replayed (moving the caret or selecting, with the mouse or the arrows; a command with no
// Doc equivalent) is written as a comment, so the script says what it leaves out. Stop hands the script to the host,
// which asks for a name and saves it in the user's Macros folder.

function ahkValue(v) {
  if (v === null || v === undefined) return '""';
  if (typeof v === "boolean") return v ? "true" : "false";
  if (typeof v === "number") return Number.isFinite(v) ? String(v) : '""';
  if (Array.isArray(v)) return "[" + v.map(ahkValue).join(", ") + "]";
  if (typeof v === "object")
    return "{" + Object.entries(v).map(([k, x]) => `${isIdentifier(k) ? k : `%${ahkValue(k)}%`}: ${ahkValue(x)}`).join(", ") + "}";
  return '"' + String(v).replace(/`/g, "``").replace(/"/g, '`"').replace(/\r/g, "`r").replace(/\n/g, "`n").replace(/\t/g, "`t") + '"';
}
// One command as a Doc call: Doc.FontSize(14), Doc.Find("x", , 2); its arguments in the order the command lists them
// (Doc.ahk maps them back by that order), an argument left out as an empty place.
let commandInfo = null;
function docCall(name, args = {}) {
  commandInfo ??= new Map(ribbon.commands().map((c) => [c.name, Object.keys(c.args).map((k) => k.replace(/\?$/, ""))]));
  const order = commandInfo.get(name);
  const keys = Object.keys(args).filter((k) => args[k] !== undefined);
  if (!order || !keys.every((k) => order.includes(k)))
    return `Doc.Exec(${ahkValue(name)}${keys.length ? ", " + ahkValue(args) : ""})`;
  const last = Math.max(-1, ...keys.map((k) => order.indexOf(k)));
  const values = order.slice(0, last + 1).map((k) => (k in args && args[k] !== undefined ? ahkValue(args[k]) : ""));
  return `Doc.${name[0].toUpperCase()}${name.slice(1)}(${values.join(", ")})`;
}
function recordLine(line) {

  if (recorder.typed) { recorder.lines.push(`Doc.InsertText(${ahkValue(recorder.typed)})`); recorder.typed = ""; }
  if (recorder.moved) { recorder.lines.push("; " + ui.recordMoved); recorder.moved = false; }
  if (line) recorder.lines.push(line);
  showRecording();
}
const recordCommand = (label, command) =>
  recordLine(command ? docCall(command.name, command.args) : "; " + ui.recordSkipped.replace("{0}", label));

  const mark = document.querySelector(".dax-recmark");
  if (mark) {
    mark.hidden = !recorder.on;
    mark.textContent = `● ${recordSteps()}`;
    mark.title = ui.recordStop + " (Ctrl+Shift+R)";
  }
  const button = document.querySelector(".dax-recordbutton");
  if (button) {
    button.textContent = recorder.on ? "■ " + ui.recordStop : "● " + ui.record;
    button.title = ui.recordTip;
    button.classList.toggle("dxr-on", recorder.on);
  }
  if (recorder.on) ribbon?.setStatus(ui.recording.replace("{0}", recordSteps()));
}
function toggleRecording() {
  if (!recorder.on) {
    Object.assign(recorder, { on: true, lines: [], typed: "", moved: false });
    commandInfo = null;
    showRecording();
    return;
  }
  recordLine("");
  recorder.on = false;
  showRecording();
  const lines = recorder.lines.slice();
  while (lines.length && lines[lines.length - 1].startsWith(";")) lines.pop();    // (a trailing "moved": nothing after it)
  if (!lines.some((l) => !l.startsWith(";"))) { ribbon.setStatus(ui.nothingRecorded); return; }
  const header = ["#Requires AutoHotkey v2.0", "#Include <Doc>", "; " + ui.recordHeader.replace("{0}", new Date().toLocaleString())];
  post({ type: "recorded", script: [...header, ...lines].join("\n") + "\n", taken: takenShortcuts() });

// Typing, as the document's input events tell it (Enter and Backspace are keys the editor takes itself: below).
const inDocumentBlock = (t) => t instanceof Element && !!t.closest('#app [data-anchor][contenteditable="true"]')
  && !t.closest(".docx-comment-gutter, textarea, input");
document.addEventListener("input", (e) => {
  if (!recorder.on || !inDocumentBlock(e.target)) return;
  if (e.inputType === "insertText" || e.inputType === "insertReplacementText") recorder.typed += e.data ?? "";
  else if (e.inputType === "insertFromPaste") recorder.typed += e.dataTransfer?.getData("text/plain") ?? "";
  else return;

}, true);
document.addEventListener("keydown", (e) => {

  const ctrl = e.ctrlKey || e.metaKey;
  if (e.key === "Enter" && !ctrl) { recorder.typed += "\n"; showRecording(); return; }
  if (e.key === "Backspace" && !ctrl && recorder.typed && window.getSelection()?.isCollapsed) {
    recorder.typed = Array.from(recorder.typed).slice(0, -1).join("");    // (Backspace right after typing: the last character)
    showRecording();
    return;
  }
  if (ctrl && (e.key === "Home" || e.key === "End")) {
    recordLine(docCall("moveCaret", { to: e.key === "Home" ? "documentStart" : "documentEnd" }));
    return;
  }
  if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Home", "End", "PageUp", "PageDown"].includes(e.key) || (ctrl && (e.key ?? "").toLowerCase() === "a")) {
    if (recorder.typed) recordLine("");
    recorder.moved = true;
  } else if (e.key === "Backspace" || e.key === "Delete") {
    recordLine("; " + ui.recordSkipped.replace("{0}", e.key));
  }
}, true);
// A click in the document moves the caret or selects: noted where it happened.
document.addEventListener("mousedown", (e) => {
  if (!recorder.on || !(e.target instanceof Element) || !e.target.closest("#app [data-dxr-surface]")) return;
  if (recorder.typed) recordLine("");
  recorder.moved = true;
}, true);

// --- The command palette (Ctrl+Shift+P; the magnifier in the title bar; the Macros tab), as AhkWord's: type part of a
// command's name and press Enter. It lists what the ribbon has, named and placed as the ribbon shows it (in the
// user's language: the ribbon is already translated), with its shortcut: every button and switch on the tabs, the
// title bar and the status bar; each choice of the ribbon's lists ("Style: Heading 1", "Margins: Narrow", "Zoom:
// 75%", the recent documents); the File menu; and the macros. Each runs as a click on it would (the rail, onCommand
// and so scripts' Command event see it); the document's selection is put back first. A command the ribbon can't run
// now (a disabled button, the Table tab's outside a table) is greyed out; a switch says whether it is on. With

const PALETTE_RECENT = "dax.palette.recent";
function paletteRecent() {
  try { return JSON.parse(localStorage.getItem(PALETTE_RECENT) ?? "[]"); } catch { return []; }
}
function rememberPaletteItem(key) {
  try { localStorage.setItem(PALETTE_RECENT, JSON.stringify([key, ...paletteRecent().filter((k) => k !== key)].slice(0, 30))); } catch { }
}

  return (text.match(/\p{L}/gu) ?? []).length >= 3 ? text : tip || squash(el.getAttribute("aria-label")) || text;

const shortcutOf = (el) => /\(((?:Ctrl|Alt|Shift|F\d)[^)]*)\)\s*$/.exec(el.title ?? "")?.[1] ?? "";
// "Home > Font"; the title bar's and the status bar's controls say so.
function placeOf(el) {

  if (panel) {
    const tab = document.querySelector(`#app .dxr-tab[data-tab="${panel.dataset.panel}"]`);
    return [squash(tab?.textContent), squash(el.closest(".dxr-group")?.querySelector(".dxr-glabel")?.textContent)].filter(Boolean).join(" > ");
  }

// (a contextual tab, Table or Header & Footer, is hidden while the caret is elsewhere: its commands can't run now)
function inHiddenTab(el) {

function runControl(el, act) {

  act();

function paletteItems() {
  const root = document.querySelector("#app .dxr");
  if (!root) return [];
  const items = [], keys = new Set(), names = new Set();
  const add = (item) => {
    if (!item.name || keys.has(item.key)) return;
    keys.add(item.key);
    names.add(item.name.toLowerCase());
    items.push(item);
  };
  // (the Paragraph dialog's own fields; its launcher listed once, from Home)
  const skip = (el) => !!el.closest('.dxr-pop, .dxr-dialog, [data-dxr="findbar"], [data-dxr="loader"], .dax-palette-back, .dax-macromenu')
    || el.type === "file" || el.dataset.dxr === "filebutton" || el.dataset.dxr === "save" || el.dataset.dxr === "pastemore"
    || el.dataset.dxr === "paralaunchlayout";

    const id = el.dataset.dxr ?? el.dataset.cmd ?? el.dataset.list ?? el.dataset.align ?? "";
    if (el.type === "checkbox") {

      add({ key: "c:" + (id || name), name, where: placeOf(el), description: squash(el.title), keys: "", on: el.checked, switch: true, off,
        run: () => runControl(el, () => el.click()) });

      if (el.matches(".dax-palette-button, .dax-palettetab, .dax-macrobutton, .dax-settings, .dax-recmark, .dax-userbutton")) continue;
      const name = controlName(el);

  // in the status bar) is listed once.
  for (const select of root.querySelectorAll("select")) {

});

// A Word document dropped on the window opens in it (the host asks to save the one open first). WebView2 hands the
// host the dropped File objects, from which it gets their paths. Any other file dropped where the editor doesn't take
// it must not make the page navigate to it.
const isWordFile = (f) => /\.(docx|docm)$/i.test(f.name);
window.addEventListener("dragover", (e) => {
  if (e.dataTransfer?.types?.includes("Files")) { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; }
}, true);
window.addEventListener("drop", (e) => {
  const files = Array.from(e.dataTransfer?.files ?? []);
  if (files.some(isWordFile)) {
    e.preventDefault();
    e.stopPropagation();
    host?.postMessageWithAdditionalObjects?.({ type: "drop" }, files.filter(isWordFile));
  }
}, true);
window.addEventListener("drop", (e) => { if (e.dataTransfer?.types?.includes("Files")) e.preventDefault(); });

window.addEventListener("error", (e) => post({ type: "log", text: "error: " + e.message }));
window.addEventListener("unhandledrejection", (e) => post({ type: "log", text: "rejection: " + (e.reason?.stack || e.reason) }));

// The ribbon is mounted directly (not createRibbonEditor, which fades the overlay out as soon as the engine is up):
// the overlay then covers the engine's start AND the document's mount, in one go.
const tBoot = performance.now();
// Who is editing (dAHKxodus.cs, UserIdentity): the name on comments and tracked changes, and the comments' initials
// ("" takes them from the name). Without a host (the page opened on its own) the ribbon's defaults apply.
const who = new URLSearchParams(location.search);
ribbon = mountRibbon("#app", {
  frame: "flush",
  // (Not paginated: here, even when the last window closed in page view. The ribbon's own open, which New uses, fails
  // in page view ("Pagination requires staging and container elements attached to their document"): every document
  // opens in continuous view, and applyView switches to page view once it is in, as the user's click would.)
  ...(who.get("user") ? { commentAuthor: who.get("user"), revisionAuthor: who.get("user"), commentInitials: who.get("initials") ?? "" } : {}),
  typingUndo: "word",    // Undo takes typing back a word at a time, as in Word (the engine answers natively, in ms)
  // List levels > Also for new documents: the host keeps them ([Lists] Defaults) for every window and document.
  onListDefaults: (levels) => post({ type: "listDefaults", levels: JSON.stringify(levels) }),
  // Show/Hide ¶ (the button, Ctrl+Shift+8, a script): kept with the view.
  onFormattingMarksChange: () => setTimeout(reportView, 0),
  // Find's options (the find bar's Options menu): the host keeps them ([Find] Options) for every window.
  onFindOptionsChange: (options) => post({ type: "findOptions", options: Object.keys(options).join(",") }),
  // Paste: Word's clipboard HTML names its pictures as files in the temporary folder, which the page cannot read; the
  // host reads them (EngineHost.ReadPastedImage). Pictures on the web the page fetches itself.
  resolvePasteImage: async (src) => {
    if (!/^(file|https?):/i.test(src) || !host?.hostObjects?.engine) return null;
    try { return (await host.hostObjects.engine.ReadPastedImage(src)) || null; } catch { return null; }
  },
  // Save (the button, Ctrl+S): the host writes the bytes to the document's file (asking where, the first time) and
  // answers savedOk, which marks the document saved; a cancelled or failed save leaves it changed.
  // (a macro being recorded keeps the File commands that a script can repeat: Save, New, Print; the others as a note)
  onSave: (bytes, name) => {
    if (nativeBridge?.verifyReport) post({ type: "log", text: "verify: " + nativeBridge.verifyReport() });
    recordLine("Doc.Save()");
    if (hooksBeforeSave) { post({ type: "saveRequest" }); return; }    // (the hook first: these bytes may be out of date)
    post({ type: "saved", name, b64: toB64(bytes) });
  },
  onDirtyChange: (dirty) => post({ type: "dirty", dirty }),
  // What the engine refused (a paste it could not take, ...) goes to the log, so a report says why.
  onEditFailed: (info) => post({ type: "log", text: `editor: the engine refused an edit${info.code ? ` (${info.code})` : ""}: ${info.message}` }),
  onNewRequest: () => { recordLine("Doc.New()"); post({ type: "newRequest" }); },
  onOpenRequest: () => { recordLine("; " + ui.recordSkipped.replace("{0}", "Open")); post({ type: "openRequest" }); },
  onOpenRecent: (entry) => { recordLine(`Doc.Open(${ahkValue(entry.id)})`); post({ type: "openRecent", path: entry.id }); },
  // The File menu (the File tab, Alt+F): Save As and the host's commands go to the host.
  onSaveAsRequest: () => { recordLine("; " + ui.recordSkipped.replace("{0}", "Save As")); post({ type: "saveAsRequest" }); },
  fileMenu: hostFileMenu(),
  onFileMenu: (id) => {
    if (id === "print") recordLine("Doc.Print()");
    else if (id === "pdf") recordLine("; " + ui.recordSkipped.replace("{0}", ui.pdf ?? "Export to PDF"));
    else if (id === "copy") recordLine("; " + ui.recordSkipped.replace("{0}", ui.copy ?? "Save a Copy As"));
    post({ type: { settings: "settingsRequest", close: "closeRequest", print: "printRequest", pdf: "pdfRequest", copy: "copyRequest" }[id] ?? "fileMenu", id });
  },
  onOpen: () => ribbon && addAhkButton(),
  // Scripts' Command event (a macro recorder's source later), and TextChanged after a command.
  onCommand: (label, ms, command) => {
    post({ type: "command", label, name: command?.name ?? "", ...(command ? { args: command.args } : {}) });
    textChanged();
    if (recorder.on) recordCommand(label, command);
  },
});
// What the host asks: before it closes or replaces the document, and for scripts (Doc.ahk): an editor command by name
// as the ribbon runs it (the rail and onCommand see it), and the list of them.
window.dax = {
  isDirty: () => !!ribbon?.isDirty,
  // (async: a command that takes a while, paste, answers when it is done; the host awaits it)
  exec: async (name, args) => {
    try {
      const result = await ribbon.exec(name, args ?? {});
      return { result: result === undefined ? null : result };
    } catch (err) {
      return { error: String(err?.message ?? err), code: err?.code ?? "error" };
    }
  },
  // (each command's argument names in their order: an AutoHotkey object lists its keys sorted, so Doc.ahk maps
  // positional arguments by this)
  commands: () => ribbon.commands().map((c) => ({ ...c, order: Object.keys(c.args) })),
};
ribbon.loader.stage(0);
// The WASM runtime still starts (~200 ms): the session bridge is the host's, but the rest of the exports (the
// converter the editor falls back to, comparison) stay the page's own. ?engine=wasm keeps the session here too.
await initialize(new URL("./node_modules/docxodus/dist/wasm/", location.href).href);
const wasmExports = getWasmExports();
const params = new URLSearchParams(location.search);
let nativeBridge = params.get("engine") === "wasm" ? null : nativeSessionBridge();
if (nativeBridge && params.get("verify") === "1") nativeBridge = verifyingBridge(nativeBridge, wasmExports.DocxSessionBridge);
const engineKind = nativeBridge ? (nativeBridge.verifyReport ? "native, verified against WASM" : "native") : "wasm";
ribbon.setExports(nativeBridge ? { ...wasmExports, DocxSessionBridge: nativeBridge } : wasmExports);
ribbon.loader.stage(1);
post({ type: "ready", engine: engineKind, sinceNavigation: ms(performance.now()), boot: ms(performance.now() - tBoot), scripts: ms(tImported - tPage) });
</script>
</body>
</html>

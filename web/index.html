<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dAHKxodus</title><style>
  html, body { margin: 0; height: 100%; background: #f3f3f3; }
  #app { height: 100vh; }
  .dax-ahk { margin-left: 8px; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
// dAHKxodus: Docxodus's ribbon editor in a WebView2 host (dAHKxodus.cs).
// Messages to the host:   ready, opened, openFailed, saved (the document's bytes: Save, or the host's "save" with its
//                         id), dirty (the document changed or was saved), newRequest, openRequest, openRecent (a
//                         path), saveAsRequest, settingsRequest, view (the view changed), drop (files dropped on the
//                         page, as additional objects), ahk (a call to an AutoHotkey function), log
// Messages from the host: open (a document's bytes), blank (a new document), save (send the bytes back, with the
//                         id), savedOk (the file is written), recent (the recent documents), ui (labels in the user's
//                         language), user (a new name and initials), ahkResult, measure
// The host owns the files: New, Open, the Recent list and Save go to it, and it asks to save a changed document
// before replacing or closing it (window.dax.isDirty()).
// The loading overlay stays up from the start until the document is in, and a long document mounts window by window
// (ribbon.openAsync, ribbon-open-async.js), so the overlay keeps moving and shows how far the mount has got.
// The editing session runs in the host, natively in .NET (nativeSessionBridge): the page's WASM engine starts too but
// serves only the rarely used rest of its exports. ?engine=wasm runs the session in the page; ?verify=1 runs it in both.
const tPage = performance.now();
const { mountRibbon, initialize, getWasmExports } = await import("./node_modules/docxodus/dist/embed.bundle.js");
const { addOpenAsync } = await import("./ribbon-open-async.js");
const tImported = performance.now();

const host = window.chrome?.webview;
const post = (m) => host?.postMessage(m);
const ms = (t) => Math.round(t);
const frame = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));

const toB64 = (bytes) => {
  if (bytes.toBase64) return bytes.toBase64();
  let s = "";
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
};
const fromB64 = (b64) => Uint8Array.fromBase64 ? Uint8Array.fromBase64(b64) : Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));

// --- The native engine: the editing session runs in the host (.NET), not in this page's WASM runtime.
// Returns an object with the same functions as the WASM export DocxSessionBridge, each a synchronous call to the
// host's engine object (dAHKxodus.cs, EngineHost), or null when the host has none. The host's manifest gives
// every method's parameter and return types: bytes cross as base64, a null result or an exception as "\0..." text.
function nativeSessionBridge() {
  const engine = host?.hostObjects?.sync?.engine;
  if (!engine) return null;
  const manifest = JSON.parse(engine.Manifest());
  const bridge = {};
  for (const [method, sig] of Object.entries(manifest)) {
    const [cls, name] = method.split(".");
    if (cls !== "DocxSessionBridge") continue;
    const bytesAt = sig.p.map((t) => t.startsWith("bytes"));
    const ret = sig.r.replace("?", "");
    bridge[name] = (...args) => {
      const wire = [];
      for (let i = 0; i < sig.p.length; i++) {
        const a = args[i];
        wire.push(a === undefined || a === null ? null : bytesAt[i] ? toB64(a) : a);
      }
      const r = engine.Call(method, JSON.stringify(wire));
      if (r.charCodeAt(0) === 0) {
        if (r.startsWith("\0error:")) throw new Error(r.slice(7));
        return ret === "void" ? undefined : null;
      }
      switch (ret) {
        case "void": return undefined;
        case "int": case "long": case "double": return Number(r);
        case "bool": return r === "true";
        case "bytes": return fromB64(r);
        default: return r;
      }
    };
  }
  return bridge;
}

// ?verify=1 (DAHKXODUS_VERIFY=1): every session call runs on the native engine AND on the page's WASM engine, which
// holds a twin of each session; the editor gets the native answer, and the two answers are compared. A test of the
// native engine, not for use: the open takes the time of both. Logs counts, method names and offsets only (no text).
function verifyingBridge(native, wasm) {
  const twin = new Map();                       // native session/transaction handle -> the WASM one
  const tally = { calls: 0, same: 0, opened: 0, differ: new Map() };
  const same = (a, b) => {
    if (a instanceof Uint8Array && b instanceof Uint8Array) return a.length === b.length && a.every((x, i) => x === b[i]);
    return a === b || (a == null && b == null);
  };
  const where = (a, b) => {                     // where two answers part, without their content
    if (typeof a !== "string" || typeof b !== "string") return `${a?.constructor?.name ?? a} vs ${b?.constructor?.name ?? b}`;
    let i = 0;
    while (i < a.length && a[i] === b[i]) i++;
    return `lengths ${a.length}/${b.length}, first difference at ${i}`;
  };
  const out = {};
  for (const name of Object.keys(native)) {
    const w = wasm[name];
    out[name] = (...args) => {
      const r = native[name](...args);
      if (typeof w !== "function") return r;
      const wargs = args.map((a, i) => (i === 0 && typeof a === "number" && twin.has(a) ? twin.get(a) : a));
      let wr, threw = null;
      try { wr = w(...wargs); } catch (e) { threw = e; }
      tally.calls++;
      if (/^(Open|Begin)/.test(name) && typeof r === "number" && typeof wr === "number") { twin.set(r, wr); tally.opened++; }
      else if (!threw && same(r, wr)) tally.same++;
      else {
        const d = tally.differ.get(name) ?? { n: 0, first: threw ? "WASM threw " + threw.message : where(r, wr) };
        d.n++;
        tally.differ.set(name, d);
      }
      return r;
    };
  }
  out.verifyReport = () => `${tally.calls} calls on both engines: ${tally.opened} opened twin sessions, ${tally.same} answered identically` +
    (tally.differ.size ? "; differ: " + [...tally.differ].map(([k, d]) => `${k} ${d.n}x (${d.first})`).join("; ") : "");
  return out;
}

// --- The AutoHotkey bridge: callAhk("LegalDate") resolves with what the AHK function returned.
const pending = new Map();
let nextId = 0;
function callAhk(fn, arg = "") {
  return new Promise((resolve, reject) => {
    const id = ++nextId;
    pending.set(id, { resolve, reject });
    post({ type: "ahk", id, fn, arg: String(arg) });
  });
}
window.callAhk = callAhk;

let ribbon;
let docName = "untitled.docx";

// Opens with the overlay narrating the mount. Also measures how responsive the page stayed: the longest gap between
// painted frames, and how long until the first window of paragraphs landed (the session open before it is one call).
// Paragraphs per window: each window is one engine call with a fixed cost (~55 ms at Docxodus's default of 24, which
// made a 9,500-paragraph document take 23 s instead of 4). ?window=N overrides it (DAHKXODUS_WINDOW in the host).
const WINDOW_SIZE = Number(new URLSearchParams(location.search).get("window")) || 400;
async function openBytes(bytes, name) {
  docName = name;
  const loader = ribbon.loader;
  loader.show();
  loader.stage({ title: "Opening " + name, copy: "Reading the document and laying out its paragraphs.", progress: 40, label: "Reading document" });
  await frame(); // let the new copy paint before the engine call
  let watching = true, last = performance.now(), longestGap = 0;
  const watch = (now) => { longestGap = Math.max(longestGap, now - last); last = now; if (watching) requestAnimationFrame(watch); };
  requestAnimationFrame(watch);
  // (Profiling: time spent in each engine call during the open.)
  const bridge = ribbon.exports?.DocxSessionBridge, calls = {}, originals = {};
  if (bridge) for (const k of Object.keys(bridge)) {
    if (typeof bridge[k] !== "function") continue;
    originals[k] = bridge[k];
    bridge[k] = (...a) => { const s = performance.now(); try { return originals[k](...a); } finally { const c = calls[k] ??= { n: 0, ms: 0 }; c.n++; c.ms += performance.now() - s; } };
  }
  const t = performance.now();
  let firstWindow = 0;
  openInContinuousView();
  await ribbon.openAsync(bytes, name, {
    windowSize: WINDOW_SIZE,
    onProgress: (mounted, total) => {
      if (!firstWindow) firstWindow = performance.now() - t;
      loader.progress(40 + Math.round(55 * mounted / Math.max(total, 1)), `${mounted.toLocaleString()} of ${total.toLocaleString()} paragraphs`);
    },
  });
  const opened = performance.now();
  watching = false;
  if (bridge) {
    Object.assign(bridge, originals);
    const engine = Object.values(calls).reduce((s, c) => s + c.ms, 0);
    const top = Object.entries(calls).sort((a, b) => b[1].ms - a[1].ms).slice(0, 6).map(([k, c]) => `${k} ${c.n}x ${ms(c.ms)} ms`);
    post({ type: "log", text: `open profile (${engineKind}): engine ${ms(engine)} ms of ${ms(opened - t)} ms; ${top.join("; ")}` });
    if (engineKind.startsWith("native")) post({ type: "engineStats" });
  }
  loader.done();
  await frame();
  const painted = performance.now();
  const blocks = document.querySelectorAll("#app [data-anchor]").length;
  return { open: ms(opened - t), firstWindow: ms(firstWindow), longestGap: ms(longestGap), paint: ms(painted - opened), blocks };
}

// Insert AHK's answer at the caret, as typing would (the editor commits it like any other input).
async function insertFromAhk(fn) {
  const sel = window.getSelection();
  const range = sel && sel.rangeCount ? sel.getRangeAt(0).cloneRange() : null;
  const t = performance.now();
  const text = await callAhk(fn);
  const roundTrip = performance.now() - t;
  if (range) { sel.removeAllRanges(); sel.addRange(range); }
  document.execCommand("insertText", false, text);
  return { text, roundTrip: Math.round(roundTrip * 10) / 10 };
}

// The measure run's checks of milestone 1, through the page as the user's keys and clicks would go (no keys are sent
// to the desktop): typing undone and redone by Ctrl+Z / Ctrl+Shift+Z, then a comment and a picture, which the saved
// copy carries (its comment's date and initials, the picture's part in word/media: tests\check-saved.ps1).
async function editChecks() {
  const results = [...unchangedResults];
  const editable = () => Array.from(document.querySelectorAll('#app p[data-anchor][contenteditable="true"]'))
    .filter((p) => !p.closest("table") && p.textContent.trim().length > 0);
  const caretAtEnd = (el) => {
    el.focus();
    const r = document.createRange();
    r.selectNodeContents(el);
    r.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(r);
  };
  const ctrl = (key, shiftKey = false) => document.activeElement?.dispatchEvent(
    new KeyboardEvent("keydown", { key, ctrlKey: true, shiftKey, bubbles: true, cancelable: true }));
  const shows = (text) => document.querySelector("#app").textContent.includes(text);

  caretAtEnd(editable()[0]);
  document.execCommand("insertText", false, " daxtyped");
  ctrl("z");
  await frame();
  results.push(`Ctrl+Z ${shows("daxtyped") ? "FAILED" : "ok"}`);
  ctrl("z", true);
  await frame();
  results.push(`Ctrl+Shift+Z ${shows("daxtyped") ? "ok" : "FAILED"}`);
  ctrl("z");
  await frame();
  ctrl("y");
  await frame();
  results.push(`Ctrl+Y ${shows("daxtyped") ? "ok" : "FAILED"}`);

  caretAtEnd(editable()[0]);
  const comment = ribbon.editor.addComment("A comment from the measure run.");
  results.push(`comment ${comment ? "ok" : "FAILED"}`);
  caretAtEnd(editable()[0]);
  const png = "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==";
  results.push(`picture ${ribbon.editor.insertImage(png) ? "ok" : "FAILED"}`);
  document.activeElement?.blur?.();
  await frame();

  // The host's own save, as before closing a changed document: it asks for the bytes, writes them (a measure run
  // writes beside its copy) and answers savedOk, after which the document reads as unchanged.
  results.push(`changed ${window.dax.isDirty() ? "ok" : "FAILED"}`);
  const savedOk = new Promise((resolve) => { savedOkWaiters.push(resolve); setTimeout(() => resolve(null), 10000); });
  post({ type: "measureSave" });
  results.push(`host save ${(await savedOk) ? "ok" : "FAILED"}`);
  results.push(`unchanged after save ${window.dax.isDirty() ? "FAILED" : "ok"}`);
  return results.join(", ");
}
const savedOkWaiters = [];

// (Measure runs) The host's picture of the editor as it shows, logs\<name>.png; resolves when it is written.
const captureWaiters = new Map();
function capture(name) {
  return new Promise((resolve) => {
    captureWaiters.set(name, resolve);
    setTimeout(() => { captureWaiters.delete(name); resolve(); }, 5000);
    post({ type: "capture", name });
  });
}

// The File tab, as a click would: the menu opens with the ribbon's commands and the host's (Settings, Close), a
// picture of it is taken (logs\measure-file-menu.png), and Escape closes it.
async function fileMenuChecks() {
  const button = ribbon.control("filebutton"), menu = ribbon.control("filemenu");
  if (!button || !menu) return "no File tab FAILED";
  button.dispatchEvent(new MouseEvent("mousedown", { bubbles: true, cancelable: true }));
  button.click();
  await frame();
  const shown = Array.from(menu.querySelectorAll('button[role="menuitem"]'))
    .filter((b) => b.offsetParent !== null).map((b) => b.querySelector("span")?.textContent ?? "");
  const opened = menu.hasAttribute("data-open");
  await capture("measure-file-menu");
  menu.querySelector("button")?.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
  await frame();
  // (the ribbon's own items in the language in use: the host's table for the ribbon, or English)
  const label = (english) => ui.ribbon?.[english] ?? english;
  const want = [label("New"), label("Open…"), label("Save"), label("Save As…"), ui.settings, ui.close];
  const ok = opened && want.every((w) => shown.includes(w)) && !menu.hasAttribute("data-open");
  const tabs = Array.from(document.querySelectorAll("#app .dxr-tab:not([hidden])")).map((t) => t.textContent.trim()).join(" | ");
  return `${opened ? "opened" : "NOT opened"}, items ${shown.join(" | ")}, ${menu.hasAttribute("data-open") ? "still open" : "closed by Escape"} ${ok ? "ok" : "FAILED"}; tabs ${tabs}`;
}

// The ribbon's Numbering and Increase indent buttons, as clicks would: three neighbouring paragraphs numbered, the
// middle one indented. Word shows "1.", "a.", "2." (a nested level steps to the next number format).
async function numberingChecks() {
  const blocks = () => Array.from(document.querySelectorAll('#app [data-anchor][contenteditable="true"]'))
    .filter((p) => !p.closest("table") && p.textContent.trim().length > 0);
  const all = blocks();
  let run = -1;
  for (let i = 0; i + 2 < all.length && run < 0; i++)
    if (all[i].nextElementSibling === all[i + 1] && all[i + 1].nextElementSibling === all[i + 2]
        && ![all[i], all[i + 1], all[i + 2]].some((p) => p.dataset.anchor?.startsWith("li"))) run = i;
  if (run < 0) return "no three neighbouring paragraphs";
  const keys = all.slice(run, run + 3).map((p) => p.textContent.trim().slice(0, 24));
  const find = (key) => blocks().find((p) => p.textContent.includes(key));
  const click = (selector) => ribbon.element?.querySelector?.(selector) ?? document.querySelector(`#app ${selector}`);
  for (const key of keys) {
    const p = find(key);
    p.focus();
    click('button[data-list="decimal"]').click();
    await frame();
  }
  find(keys[1]).focus();
  click('button[data-indent="720"]').click();
  await frame();
  const labels = keys.map((key) => {
    const text = find(key)?.textContent.trim() ?? "";
    return text.slice(0, Math.max(0, text.indexOf(key))).trim() || "(none)";
  });
  const ok = labels[0] === "1." && labels[1] === "a." && labels[2] === "2.";
  return `labels ${labels.join(" | ")} ${ok ? "ok" : "FAILED"}`;
}

// The ribbon's Table button, as a click would: the caret in a paragraph, the grid opened, a cell pressed (2 rows, 3
// columns). In page view and in continuous view; reports the tables in the document before and after, and what the
// ribbon's rail and status say.
async function tablePickerChecks() {
  const out = [];
  for (const paginated of [true, false]) {
    applyView({ paginated });
    await frame();
    const block = Array.from(document.querySelectorAll('#app p[data-anchor][contenteditable="true"]'))
      .find((p) => !p.closest("table") && p.textContent.trim().length > 0);
    if (!block) { out.push(`${paginated ? "page" : "continuous"}: no paragraph`); continue; }
    block.focus();
    const r = document.createRange();
    r.selectNodeContents(block); r.collapse(false);
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    const before = document.querySelectorAll("#app table").length;
    const button = ribbon.control("table");
    button.dispatchEvent(new MouseEvent("mousedown", { bubbles: true, cancelable: true }));
    button.click();
    const picker = ribbon.control("gridpicker");
    const opened = picker?.hasAttribute("data-open");
    const cell = ribbon.control("gridcells")?.querySelector('[data-r="1"][data-c="2"]');
    let error = "";
    try {
      cell?.dispatchEvent(new PointerEvent("pointerover", { bubbles: true }));
      cell?.dispatchEvent(new MouseEvent("mousedown", { bubbles: true, cancelable: true }));
    } catch (err) { error = " error " + err.message; }
    await frame();
    const after = document.querySelectorAll("#app table").length;
    out.push(`${paginated ? "page" : "continuous"}: picker ${opened ? "opened" : "NOT opened"}, cell ${cell ? "found" : "MISSING"}, `
      + `tables ${before} -> ${after} ${after > before ? "ok" : "FAILED"}, closed ${picker?.hasAttribute("data-open") ? "no" : "yes"}, `
      + `rail "${ribbon.control("railOp")?.textContent ?? ""}", status "${ribbon.control("status")?.textContent ?? ""}"${error}`);
  }
  // A new blank document: the grid pressed before the document was ever clicked, then with the caret in its paragraph;
  // then (the user's case) in page view. Tables counted only when they show (a size, and not inside a hidden element).
  // (showing: a size, laid out, and its cells' borders drawn: a borderless empty table looks like nothing at all)
  const shown = () => Array.from(document.querySelectorAll("#app table"))
    .filter((t) => {
      const b = t.getBoundingClientRect(), td = t.querySelector("td, th");
      return b.width > 0 && b.height > 0 && t.offsetParent !== null && !!td && getComputedStyle(td).borderTopStyle !== "none";
    });
  const describe = (t) => {
    if (!t) return "none";
    const b = t.getBoundingClientRect();
    const chain = [];
    for (let e = t.parentElement; e && e.id !== "app" && chain.length < 5; e = e.parentElement)
      chain.push(`${e.tagName.toLowerCase()}${e.className ? "." + String(e.className).trim().split(/\s+/).join(".") : ""}`);
    const td = t.querySelector("td, th");
    const cs = td ? getComputedStyle(td) : null;
    return `${Math.round(b.width)}x${Math.round(b.height)} at ${Math.round(b.left)},${Math.round(b.top)}, `
      + `${t.offsetParent ? "" : "NOT "}laid out, in ${chain.join(" < ")}; ${t.rows?.length} rows, ${td ? td.parentElement.cells.length : 0} cells a row, `
      + `cell border ${cs ? `${cs.borderTopStyle} ${cs.borderTopWidth} ${cs.borderTopColor}` : "-"}, cell ${td ? Math.round(td.getBoundingClientRect().height) : 0}px high, `
      + `borderless option ${ribbon.control("gridborderless")?.checked}; html ${t.outerHTML.slice(0, 300).replace(/\s+/g, " ")}`;
  };
  for (const [caret, paginated] of [[false, false], [true, false], [false, true]]) {
    savedView.paginated = paginated;
    openInContinuousView();
    ribbon.openBlank("blank.docx");
    applyView(savedView); caretAtStart(); relabel();
    await frame();
    window.getSelection().removeAllRanges();
    document.activeElement?.blur?.();
    if (caret) {
      const p = document.querySelector('#app [data-anchor][contenteditable="true"]');
      p?.focus();
      const r = document.createRange(); r.selectNodeContents(p); r.collapse(true);
      window.getSelection().addRange(r);
    }
    const before = document.querySelectorAll("#app table").length;
    ribbon.control("table").click();
    const cell = ribbon.control("gridcells")?.querySelector('[data-r="1"][data-c="2"]');
    cell?.dispatchEvent(new MouseEvent("mousedown", { bubbles: true, cancelable: true }));
    await frame();
    const after = document.querySelectorAll("#app table").length;
    const visible = shown();
    out.push(`blank${paginated ? " in page view" : ""}, ${caret ? "caret in it" : "never clicked"}: tables ${before} -> ${after}, `
      + `${visible.length} showing ${visible.length > 0 ? "ok" : "FAILED"}, `
      + `closed ${ribbon.control("gridpicker")?.hasAttribute("data-open") ? "no" : "yes"}, rail "${ribbon.control("railOp")?.textContent ?? ""}"; `
      + `table: ${describe(document.querySelector("#app table"))}`);
    if (paginated) await capture("measure-table-page-view");
  }
  savedView.paginated = false;
  return out.join("; ");
}

// Before the measure run edits anything: a document only opened (and looked at: the deferred work after an open has
// run, the caret is put in it and taken out again) has no changes, so closing it must not ask to save.
const unchangedResults = [];
async function unchangedChecks() {
  const state = () => `version ${ribbon.editor?.version} saved ${ribbon.savedVersion}, typed ${ribbon.typed} saved ${ribbon.savedTyped}`;
  await new Promise((r) => setTimeout(r, 1500));
  unchangedResults.push(`unchanged after open ${window.dax.isDirty() ? `FAILED (${state()})` : "ok"}`);
  const block = document.querySelector('#app [data-anchor][contenteditable="true"]');
  block.focus();
  await frame();
  block.blur();
  await frame();
  unchangedResults.push(`unchanged after a click ${window.dax.isDirty() ? `FAILED (${state()})` : "ok"}`);
  // The view as settings restore it (page view, zoom, comments and the rail switched), then back: not a change.
  const before = viewState();
  applyView({ paginated: !before.paginated, zoom: 1.5, comments: !before.comments, rail: !before.rail });
  await frame();
  const switched = viewState();
  const applied = switched.paginated !== before.paginated && Math.abs(switched.zoom - 1.5) < 1e-6
    && switched.comments !== before.comments && switched.rail !== before.rail;
  applyView(before);
  await frame();
  unchangedResults.push(`view restored ${applied ? "ok" : `FAILED (${JSON.stringify(switched)})`}`);
  unchangedResults.push(`unchanged after view changes ${window.dax.isDirty() ? `FAILED (${state()})` : "ok"}`);
}

// The host's labels for the AutoHotkey button and its File menu commands, in the user's language (its "ui" message).
const ui = {
  settings: "Settings", settingsTip: "dAHKxodus's settings (Ctrl+,)", close: "Close", closeTip: "Close dAHKxodus",
  ahk: "AHK: date", ahkTip: "Ask AutoHotkey for today's date (LegalDate in dAHKxodus.ahk) and type it at the caret",
};
// The ribbon's text in the user's language: its own (lang\<code>.ribbon.json, from the host; {} is English), and the
// help line under it, which the host gives whole (a sentence translated word by word would read badly). Again after
// each open: the ribbon rebuilds some lists then (the styles).
function relabel() {
  if (!ribbon) return;
  ribbon.setLabels(ui.ribbon ?? {});
  const hint = document.querySelector("#app [data-dxr-hint]");
  if (hint && ui.hint) hint.innerHTML = ui.hint;    // (the host's own text, from lang\<code>.json)
}

// The host's commands at the foot of the ribbon's File menu (after New, Open, Save, Save As and Recent).
const hostFileMenu = () => [
  { id: "settings", label: ui.settings, title: ui.settingsTip, shortcut: "Ctrl+," },
  { id: "close", label: ui.close, title: ui.closeTip, separatorBefore: true },
];
function labelButtons() {
  const ahk = document.querySelector(".dax-ahk");
  if (ahk) { ahk.textContent = ui.ahk; ahk.title = ui.ahkTip; }
  ribbon?.setFileMenu(hostFileMenu());
}

// After Save: the AutoHotkey button.
function addAhkButton() {
  const save = ribbon.control("save");
  if (!save || document.querySelector(".dax-ahk")) return;
  const b = document.createElement("button");
  b.className = save.className + " dax-ahk";
  b.addEventListener("mousedown", (e) => e.preventDefault()); // keep the document's selection
  b.addEventListener("click", () => insertFromAhk("LegalDate").catch((e) => ribbon.setStatus("AHK: " + e.message)));
  save.after(b);
  labelButtons();
}

// --- The view (page or continuous, zoom, comments shown, the rail): restored from the host's settings, and reported
// to it when it changes, so the next start looks the same. Set through the ribbon's own controls, as a click would.
const viewParams = new URLSearchParams(location.search);
const savedView = {
  paginated: viewParams.has("paginated") ? viewParams.get("paginated") === "1" : null,
  zoom: viewParams.has("zoom") ? parseFloat(viewParams.get("zoom")) : null,
  comments: viewParams.has("comments") ? viewParams.get("comments") === "1" : null,
  rail: viewParams.has("rail") ? viewParams.get("rail") === "1" : null,
};
function viewState() {
  return {
    paginated: !!ribbon.control("paginated")?.checked,
    zoom: ribbon.editor?.requestedZoom ?? null,
    comments: !!ribbon.control("showcomments")?.checked,
    rail: !!ribbon.control("showrail")?.checked,
  };
}
function setChecked(name, on) {
  const box = ribbon.control(name);
  if (!box || on == null || box.checked === on) return;
  box.checked = on;
  box.dispatchEvent(new Event("change", { bubbles: true }));
}
// After an open: the caret at the start of the document's first paragraph (not a header's or footer's), as Word puts
// it. The editor inserts tables, pictures, lists and the rest at the caret, and before the document was clicked it has
// none: the Table grid then closed and inserted nothing.
function caretAtStart() {
  const first = Array.from(document.querySelectorAll('#app [data-anchor][contenteditable="true"]'))
    .find((p) => !p.closest(".docx-hf-band, .docx-hf-body, [data-hf-label], .docx-comment-gutter"));
  if (!first) return;
  first.focus({ preventScroll: true });
  const r = document.createRange();
  r.selectNodeContents(first);
  r.collapse(true);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(r);
}

// Before an open: the ribbon's open fails in page view ("Pagination requires staging and container elements attached
// to their document": it lays the pages out on a surface not yet in the page), so every document opens in continuous
// view, and applyView afterwards switches to page view if that is where the user was (savedView keeps it).
function openInContinuousView() {
  const box = ribbon.control("paginated");
  if (box) box.checked = false;    // (what the open reads; no event: the view the user chose stays in savedView)
}
// The parts that belong to the open document (zoom, comments) are applied again after each open.
function applyView(v) {
  setChecked("showrail", v.rail);
  if (!ribbon.editor) return;
  if (v.paginated != null && !!ribbon.control("paginated")?.checked !== v.paginated)
    ribbon.control(v.paginated ? "viewpage" : "viewweb")?.click();
  setChecked("showcomments", v.comments);
  if (v.zoom > 0 && Math.abs((ribbon.editor.requestedZoom ?? 1) - v.zoom) > 1e-6) {
    const select = ribbon.control("zoomlevel") ?? ribbon.control("zoom");
    if (select) {
      const value = String(v.zoom);
      if (!Array.from(select.options).some((o) => o.value === value)) select.add(new Option(`${Math.round(v.zoom * 100)}%`, value));
      select.value = value;
      select.dispatchEvent(new Event("change", { bubbles: true }));
    }
  }
}
let reportedView = "";
function reportView() {
  if (!ribbon?.editor) return;
  const state = JSON.stringify(viewState());
  if (state === reportedView) return;
  reportedView = state;
  Object.assign(savedView, JSON.parse(state));    // (the next document opens in the view the user has now)
  post({ type: "view", ...JSON.parse(state) });
}
for (const type of ["change", "click"])
  document.querySelector("#app").addEventListener(type, () => setTimeout(reportView, 0));

host?.addEventListener("message", async (e) => {
  const m = e.data;
  try {
    if (m.type === "ahkResult") {
      const p = pending.get(m.id);
      pending.delete(m.id);
      if (p) m.error ? p.reject(new Error(m.error)) : p.resolve(m.result);
    } else if (m.type === "open") {
      let r;
      try { r = await openBytes(fromB64(m.b64), m.name); }
      catch (err) { ribbon.loader.done(); post({ type: "openFailed", error: String(err?.message ?? err) }); return; }
      addAhkButton();
      applyView(savedView); caretAtStart(); relabel();
      reportView();
      post({ type: "opened", ...r });
    } else if (m.type === "blank") {
      openInContinuousView();
      try { ribbon.openBlank(m.name || "untitled.docx"); }
      finally { ribbon.loader.done(); }    // (an error must not leave the loading screen up)
      addAhkButton();
      applyView(savedView); caretAtStart(); relabel();
      reportView();
    } else if (m.type === "captured") {
      captureWaiters.get(m.name)?.();
      captureWaiters.delete(m.name);
    } else if (m.type === "ui") {
      Object.assign(ui, m);
      relabel();
      labelButtons();
    } else if (m.type === "user") {
      // The name and initials from the Settings dialog: on the comments and changes made from now on.
      const author = ribbon.control("author");
      if (author) { author.value = m.name; author.dispatchEvent(new Event("change", { bubbles: true })); }
      ribbon.initials = m.initials;    // (the ribbon's own: a new name otherwise clears them)
      ribbon.editor?.setCommentAuthor(m.name, m.initials);
    } else if (m.type === "save") {
      // The host's own save (asking to save before closing, Save As): the bytes go back with its id. It always gets
      // an answer, so a save that fails here doesn't leave it waiting.
      let bytes = null, error = "nothing is open";
      try { bytes = ribbon.save(); } catch (err) { error = String(err?.message ?? err); }
      post(bytes ? { type: "saved", id: m.id, name: docName, b64: toB64(bytes) } : { type: "saveFailed", id: m.id, error });
    } else if (m.type === "savedOk") {
      ribbon.markSaved();
      savedOkWaiters.splice(0).forEach((resolve) => resolve(m.name));
      docName = m.name;
      const label = ribbon.control("docname");
      if (label) label.textContent = m.name;
    } else if (m.type === "recent") {
      ribbon.setRecent(m.entries);
    } else if (m.type === "measure") {
      // Headless check: caret at the end of the first editable block, one AHK call, then save.
      await unchangedChecks();
      const block = document.querySelector('#app [data-anchor][contenteditable="true"]');
      block.focus();
      const r = document.createRange();
      r.selectNodeContents(block);
      r.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges(); sel.addRange(r);
      const ahk = await insertFromAhk("LegalDate");
      block.blur(); // the editor commits a text edit on blur
      await frame();
      post({ type: "log", text: "edit checks: " + (await editChecks()) });
      const t = performance.now();
      const bytes = ribbon.save();
      const saveMs = ms(performance.now() - t);
      // New and Open while in page view (the document is saved above; these replace it): each opens, in page view.
      const pageView = [];
      applyView({ paginated: true });
      await frame();
      openInContinuousView();
      try { ribbon.openBlank("page-view.docx"); applyView(savedView); caretAtStart(); relabel(); pageView.push(`New ${ribbon.editor && ribbon.control("paginated").checked ? "ok" : "FAILED"}`); }
      catch (err) { pageView.push(`New FAILED (${err.message})`); }
      try { await openBytes(bytes, "page-view-open.docx"); applyView(savedView); caretAtStart(); relabel(); pageView.push(`Open ${ribbon.editor && ribbon.control("paginated").checked ? "ok" : "FAILED"}`); await new Promise((r) => setTimeout(r, 1500)); const overlay = Array.from(document.querySelectorAll("#app *")).find((e) => /^Opening /.test(e.textContent ?? "") && e.children.length < 3 && getComputedStyle(e).visibility !== "hidden" && e.getBoundingClientRect().height > 0); pageView.push(`loading screen ${overlay ? "STILL SHOWN" : "gone"} after 1.5 s`); await capture("measure-open-page-view"); }
      catch (err) { pageView.push(`Open FAILED (${err.message})`); }
      post({ type: "log", text: "page view: " + pageView.join(", ") });
      post({ type: "log", text: "file menu: " + (await fileMenuChecks()) });
      post({ type: "log", text: "numbering: " + (await numberingChecks()) });
      post({ type: "log", text: "table picker: " + (await tablePickerChecks()) });
      // The cost of crossing to the engine for a small call (an edit's calls are small): 50 GetVersion calls.
      const bridge = ribbon.exports?.DocxSessionBridge, handle = ribbon.editor?.handle;
      if (bridge?.GetVersion && typeof handle === "number") {
        const t0 = performance.now();
        for (let i = 0; i < 50; i++) bridge.GetVersion(handle);
        post({ type: "log", text: `small call (GetVersion, ${engineKind}): ${((performance.now() - t0) / 50).toFixed(2)} ms each` });
      } else post({ type: "log", text: "small call: no editor handle to time with" });
      const verify = nativeBridge?.verifyReport;
      if (verify) post({ type: "log", text: "verify: " + verify() });
      post({ type: "measured", ahk, save: saveMs, b64: toB64(bytes) });
    }
  } catch (err) {
    post({ type: "log", text: "page error: " + (err?.stack || err) });
  }
});

// Keys a word processor has and the ribbon leaves to its host (the browser's own are off: dAHKxodus.cs). Ctrl+S and
// Ctrl+O are the ribbon's while the focus is inside it; here they also work when it isn't (nothing focused yet).
window.addEventListener("keydown", (e) => {
  if (e.defaultPrevented || e.altKey) return;
  const key = e.key.toLowerCase();
  const ctrl = e.ctrlKey || e.metaKey;
  let message = null;
  if (key === "f12" && !ctrl && !e.shiftKey) message = "saveAsRequest";
  else if (ctrl && e.shiftKey && key === "s") message = "saveAsRequest";
  else if (ctrl && !e.shiftKey && key === "n") message = "newRequest";
  else if (ctrl && !e.shiftKey && key === "o") message = "openRequest";
  else if (ctrl && !e.shiftKey && key === ",") message = "settingsRequest";
  else if (ctrl && !e.shiftKey && key === "s") { e.preventDefault(); ribbon?.download(); return; }
  if (!message) return;
  e.preventDefault();
  post({ type: message });
});

// A Word document dropped on the window opens in it (the host asks to save the one open first). WebView2 hands the
// host the dropped File objects, from which it gets their paths. Any other file dropped where the editor doesn't take
// it must not make the page navigate to it.
const isWordFile = (f) => /\.(docx|docm)$/i.test(f.name);
window.addEventListener("dragover", (e) => {
  if (e.dataTransfer?.types?.includes("Files")) { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; }
}, true);
window.addEventListener("drop", (e) => {
  const files = Array.from(e.dataTransfer?.files ?? []);
  if (files.some(isWordFile)) {
    e.preventDefault();
    e.stopPropagation();
    host?.postMessageWithAdditionalObjects?.({ type: "drop" }, files.filter(isWordFile));
  }
}, true);
window.addEventListener("drop", (e) => { if (e.dataTransfer?.types?.includes("Files")) e.preventDefault(); });

window.addEventListener("error", (e) => post({ type: "log", text: "error: " + e.message }));
window.addEventListener("unhandledrejection", (e) => post({ type: "log", text: "rejection: " + (e.reason?.stack || e.reason) }));

// The ribbon is mounted directly (not createRibbonEditor, which fades the overlay out as soon as the engine is up):
// the overlay then covers the engine's start AND the document's mount, in one go.
const tBoot = performance.now();
// Who is editing (dAHKxodus.cs, UserIdentity): the name on comments and tracked changes, and the comments' initials
// ("" takes them from the name). Without a host (the page opened on its own) the ribbon's defaults apply.
const who = new URLSearchParams(location.search);
ribbon = mountRibbon("#app", {
  frame: "flush",
  // (Not paginated: here, even when the last window closed in page view. The ribbon's own open, which New uses, fails
  // in page view ("Pagination requires staging and container elements attached to their document"): every document
  // opens in continuous view, and applyView switches to page view once it is in, as the user's click would.)
  ...(who.get("user") ? { commentAuthor: who.get("user"), revisionAuthor: who.get("user"), commentInitials: who.get("initials") ?? "" } : {}),
  typingUndo: "word",    // Undo takes typing back a word at a time, as in Word (the engine answers natively, in ms)
  // Save (the button, Ctrl+S): the host writes the bytes to the document's file (asking where, the first time) and
  // answers savedOk, which marks the document saved; a cancelled or failed save leaves it changed.
  onSave: (bytes, name) => {
    if (nativeBridge?.verifyReport) post({ type: "log", text: "verify: " + nativeBridge.verifyReport() });
    post({ type: "saved", name, b64: toB64(bytes) });
  },
  onDirtyChange: (dirty) => post({ type: "dirty", dirty }),
  onNewRequest: () => post({ type: "newRequest" }),
  onOpenRequest: () => post({ type: "openRequest" }),
  onOpenRecent: (entry) => post({ type: "openRecent", path: entry.id }),
  // The File menu (the File tab, Alt+F): Save As and the host's commands go to the host.
  onSaveAsRequest: () => post({ type: "saveAsRequest" }),
  fileMenu: hostFileMenu(),
  onFileMenu: (id) => post({ type: id === "settings" ? "settingsRequest" : id === "close" ? "closeRequest" : "fileMenu", id }),
  onOpen: () => ribbon && addAhkButton(),
});
// What the host asks before it closes or replaces the document.
window.dax = { isDirty: () => !!ribbon?.isDirty };
addOpenAsync(ribbon);
ribbon.loader.stage(0);
// The WASM runtime still starts (~200 ms): the session bridge is the host's, but the rest of the exports (the
// converter the editor falls back to, comparison) stay the page's own. ?engine=wasm keeps the session here too.
await initialize(new URL("./node_modules/docxodus/dist/wasm/", location.href).href);
const wasmExports = getWasmExports();
const params = new URLSearchParams(location.search);
let nativeBridge = params.get("engine") === "wasm" ? null : nativeSessionBridge();
if (nativeBridge && params.get("verify") === "1") nativeBridge = verifyingBridge(nativeBridge, wasmExports.DocxSessionBridge);
const engineKind = nativeBridge ? (nativeBridge.verifyReport ? "native, verified against WASM" : "native") : "wasm";
ribbon.setExports(nativeBridge ? { ...wasmExports, DocxSessionBridge: nativeBridge } : wasmExports);
ribbon.loader.stage(1);
post({ type: "ready", engine: engineKind, sinceNavigation: ms(performance.now()), boot: ms(performance.now() - tBoot), scripts: ms(tImported - tPage) });
</script>
</body>
</html>
